name = "archivewatch-pulse"
main = "src/index.js"
compatibility_date = "2026-01-01"

# The counter's whole storage. Three columns, no fourth.
[[d1_databases]]
binding = "DB"
database_name = "archivewatch-pulse"
database_id = "14d3c2d8-53db-4172-a18a-1215f548abbf"

# The hourly room sweep (together.js sweepRooms): a room idle six hours is
# deleted with its presence rows, which is what privacy.html promises.
[triggers]
crons = ["17 * * * *"]

# Rate limits on the room routes (together.js limited()). Per client
# address, counted by Cloudflare for the window only — nothing is stored.
[[ratelimits]]
name = "ROOM_LIMITER"
namespace_id = "7301"
  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "ROOM_CREATE_LIMITER"
namespace_id = "7302"
  [ratelimits.simple]
  limit = 10
  period = 60
