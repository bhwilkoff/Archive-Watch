name: Wikidata Commons posters

# Track B artwork: give catalog items that have a Wikidata QID but no real
# poster a Wikimedia Commons image (Wikidata P18) — reaches ~3.4k films TMDb/
# OMDb can't (no IMDb id). Runs on GitHub (Wikidata/Commons reachable there;
# the dev sandbox can't reach them). Catalog lives on the catalog-source
# release (Decision 018): fetch -> enrich -> remediate -> publish -> rebuild DB.

on:
  schedule:
    - cron: '0 1 * * 3'   # weekly, Wed 01:00 UTC (off the daily cron-wave)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items to enrich this run (0 = all candidates)'
        required: false
        default: '0'

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  posters:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Enrich Wikidata/Commons posters
        run: |
          python tools/enrich_wikidata_posters.py \
            --limit ${{ github.event.inputs.limit || '0' }} | tee wdposters.log
          echo "## Wikidata Commons posters" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -4 wdposters.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      - name: Publish catalog to release
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gh_dispatch.sh publish-db.yml
