name: Publish catalog DB

# Rebuilds the prebuilt SQLite catalog (Decision 017) and re-uploads it to the
# rolling "catalog-db" GitHub Release whenever the catalog changes on main.
# Release assets (not git) host the binary — no repo bloat, generous CDN
# bandwidth, separate from the 100 GB/mo Pages budget.
#
# Path-filtered to catalog.json / series so it doesn't loop on its own runs
# (it commits nothing — assets go to the Release, not the branch).

on:
  # series/** changes still land in git (TV spines). The catalog.json itself
  # is no longer in git (Decision 018), so we also run daily — after the
  # discovery/OMDb writers republish the catalog-source release — to rebuild
  # the app's SQLite from the latest catalog. Plus manual dispatch.
  push:
    branches: [main]
    paths:
      - series/**
  schedule:
    - cron: '30 4 * * *'   # after discover-content (03:42) republishes catalog
  workflow_dispatch:

concurrency:
  group: publish-db
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # to upload release assets
      actions: write       # to dispatch the Deploy Pages workflow after the index refresh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Pull the full catalog from its release (Decision 018) so build_sqlite
      # can compile both the bundled seed and the full DB from it.
      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      # Guarantee the app-facing DB is remediated no matter which writer last
      # published the catalog (belt-and-suspenders; idempotent). This is the
      # single chokepoint that builds what the app downloads.
      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      # A film matched to a DIFFERENT film that shares its title poisons the
      # poster AND the captions (free_subtitles searches by imdbID, so a wrong
      # id fetches a wrong film's subtitles). The contradiction is already in
      # the catalog — two copies of one film disagreeing about which film they
      # are — so this needs no network. Reports every conflict; only CLEARS the
      # ones the evidence can name.
      - name: Audit title identity (wrong-film matches)
        run: python tools/audit_title_identity.py --apply | tee identity.log

      # An episode or special must be reachable INSIDE its series wherever you
      # find it. These uploads are episodes typed `tv-special` that were never
      # attached to a spine, so Home showed them as standalone films with no way
      # to reach the rest of the show. Must run BEFORE build_sqlite: the series
      # cards it puts on the TV rows are keyed on the seriesID set here.
      - name: Link orphan episodes to their spines
        run: python tools/link_orphan_episodes.py --apply | tee linkeps.log

      # Hide orphaned TV-episode DUPLICATES that masquerade as standalone films
      # (deterministic from the series/ spines + catalog; no network; idempotent).
      - name: Dedupe orphan episodes
        run: python tools/dedupe_orphan_episodes.py --apply | tee dedupe.log

      # Bake lower-quality fallback copies for heavy films (owner decision
      # 2026-08-15: a film must start within ~30s; when the best copy can't
      # stream, the app switches to a vetted same-film copy). Idempotent —
      # items already carrying fallbackVideoURL are skipped, so the daily
      # cost is only NEW heavy ingests. Never fails the build.
      - name: Bake playback fallbacks
        # --min-bytes lowered from the 1.5 GB default: Yojimbo is 639 MB and
        # was never considered, yet its archive.org node measured 32.7s to
        # first byte against 0.7s for a healthy film, and the player reported
        # `fallbackInHand=0` at the 25s mark. Size is not what makes a film
        # unstartable; the node is.
        run: python tools/bake_fallbacks.py --limit 300 --min-bytes 300000000 || true

      # A film carrying subtitleHLS PROMISES captions — tvOS fetches the VTT and
      # renders it, web and Android side-load it — and 1.7% of the advertised
      # tracks 404, so the promise fails silently on titles whose Detail screen
      # says they have subtitles. Costs nothing: the VTTs are on Pages, so this
      # touches archive.org not at all. Clears only on 404/410, never on a
      # transient. Never fails the build.
      - name: Clear subtitle tracks that 404
        run: python tools/audit_dead_subtitles.py --apply || true

      # ENFORCE the copyright gate on every DB build (Decision 027). This is the
      # PURE-DATA apply only — it hides items already CONFIRMED-copyright by the
      # network confirm phase (rights-audit.yml, scheduled) and reconciles stale
      # rights exclusions; it never hides an unconfirmed item, and its reconcile
      # skips foreign (liveness/dedup) exclusions. WHY here: the confirm workflow
      # deliberately never applied, so confirmed-copyright items (e.g. "Throw Momma
      # From The Train") drifted back onto the homepage. Applying every build closes
      # that drift so a copyrighted title can never reach an app surface.
      - name: Enforce rights gate (apply confirmed hides)
        run: |
          python tools/audit_rights.py --apply | tee rights-apply.log
          echo "## Rights gate" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -3 rights-apply.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      # PERSIST the exclusions. The apply writes catalog.json into the runner
      # and the runner is destroyed, so every run re-derived the same 6,934
      # hides from a catalog that never carried them — which is fine until a
      # run's apply is skipped or fails, and then the index ships built from
      # an UNAPPLIED catalog. That is how Dr. Strangelove (Columbia, 549,187
      # IMDb votes), Rosemary's Baby, Carrie and The Social Dilemma were live
      # on the store index while the audit had correctly judged every one of
      # them a hide. The audit was right; its answer was thrown away.
      - name: Persist the rights decisions
        run: python tools/catalog_release.py publish

      - name: Metadata quality audit (report)
        run: |
          python tools/audit_metadata.py --top 2000 | tee audit.log
          echo "## Metadata quality" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; head -28 audit.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build SQLite catalog
        run: python tools/build_sqlite.py --aliases-out aliases.json | tee db.log

      # A ranking regression is SILENT: search still returns results, only their
      # order is wrong, so nothing fails and nobody notices. Measured before the
      # fix, only 15 of the 25 most popular films came first when you searched
      # their exact title. Report-only — a bad ranking must not block shipping
      # the DB, but it must not pass unremarked either.
      - name: Search ranking check
        run: |
          python3 tools/audit_search_quality.py catalog.sqlite | tee search.log || true
          echo "## Search ranking" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -6 search.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # A chip the grid will not serve. The facet queries and the grid do not
      # share a WHERE clause, so a filter can be offered on rows browse then
      # drops — which is how the Classic TV tile came to return zero for weeks.
      # Report-only, like the ranking check above.
      - name: Browse facet check
        run: |
          python3 tools/audit_browse_facets.py --db catalog.sqlite | tee facets.log || true
          echo "## Browse facets" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -6 facets.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Summary
        run: |
          echo "## Catalog DB" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -6 db.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # CRITICAL step first: ship the DB the app downloads. This must NOT be gated
      # behind the cosmetic index commit below — a git-push RACE on the index used
      # to abort the job before this ran, leaving a STALE shipping DB on the
      # release (e.g. a concurrent writer/local push landed first).
      - name: Upload to rolling release
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure the rolling tag exists, then clobber the assets.
          gh release view catalog-db >/dev/null 2>&1 || \
            gh release create catalog-db --title "Catalog database (rolling)" \
              --notes "Prebuilt SQLite catalog served to the tvOS app (Decision 017). Re-uploaded by CI."
          # Upload: catalog.sqlite.zz (raw-DEFLATE, ~24 MB) is what the app
          # downloads + inflates natively (Decision 019). catalog.sqlite
          # (uncompressed) is kept for already-shipped app builds that still
          # fetch it directly; drop it once those ages out.
          bash tools/gh_retry.sh gh release upload catalog-db catalog.sqlite catalog.sqlite.zz catalog-manifest.json --clobber

      # Slim search index for the public editorial tool (index.html "Browse the
      # catalog"). Committed to the repo so GitHub Pages serves it same-origin
      # (Release assets have no CORS). SECONDARY + non-fatal: it commits to main,
      # which races other writers / local pushes, so retry with rebase and NEVER
      # fail the job (the DB already shipped above).
      # The BUILD is fatal: an index that fails to build is broken (Decision
      # 093 — a red X is reserved for broken), and on 2026-09-05 a NameError
      # here left the job green while the live index stayed a day stale. Only
      # the COMMIT/PUSH below is non-fatal, because that is the part that
      # races other writers.
      - name: Build catalog search index + shards
        if: always()
        run: |
          python tools/build_catalog_index.py
          python tools/build_web_details.py
          python tools/build_channel_pools.py
          python tools/build_episode_index.py

      - name: Commit catalog search index
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage FIRST, then ask the index. `git diff --quiet` is blind to
          # UNTRACKED files, so the day aliases.json was added this step
          # reported "unchanged" and committed nothing — the artifact was
          # built correctly every run and never reached the repo. Any new
          # artifact added to this list would have failed the same silent way.
          git add catalog-index.json topshelf.json details/ channel-pools.json episodes-index.json aliases.json
          if git diff --cached --quiet -- catalog-index.json topshelf.json details/ channel-pools.json episodes-index.json aliases.json; then
            echo "web index + details + channel pools + episodes unchanged"; exit 0
          fi
          git commit -m "Refresh web catalog index + detail shards [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed index on attempt $i"
              # The index commit carries [skip ci] (so it doesn't re-trigger heavy
              # writer workflows), which ALSO suppresses the push-triggered Deploy
              # Pages run — without this dispatch the live site never picks up the
              # new index/details and archivewatch.org freezes (it was 8 days stale
              # on 2026-06-27). Explicitly kick the deploy. Non-fatal.
              bash tools/gh_dispatch.sh deploy-pages.yml
              exit 0
            fi
            echo "push race, retry $i"; sleep $((i * 3))
          done
          echo "index push still racing after retries — non-fatal, DB already shipped"
