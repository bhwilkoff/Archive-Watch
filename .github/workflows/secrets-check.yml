name: Secrets check

# No secret in git (AGENTS.md hard rule; docs/SECRETS-PLAN.md). The
# pre-commit hook scans what is staged; this scans every tracked file on every
# push and pull request, so a commit made with --no-verify still turns red. Both
# checks prove themselves on planted samples before they scan. Red means a file
# shaped like a secret is in the tree, or a check broke.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No secret in any tracked file
        run: python tools/test_no_secrets.py
      - name: tools/secrets.sh never prints a value and runs only its recipes
        run: python tools/test_secrets_sh.py
      - name: tools/keychain.py reads chunked Keychain items
        run: python tools/test_keychain.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: The take-down Worker lets in only takedown-check.yml's OIDC token
        run: node tools/test_takedown_worker.mjs
