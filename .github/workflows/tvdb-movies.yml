name: TheTVDB movie posters

# Professional movie posters from TheTVDB for catalog items that lack real
# designed art (the titles the frame-capture pipeline targeted). A real poster
# beats a frame capture, so run this BEFORE apply_covers. Catalog lives on the
# release (Decision 018): fetch -> enrich -> publish -> rebuild DB. The
# title->poster cache is committed back so re-runs only look up new titles.
#
# Requires repo secret THETVDB_API_KEY.

on:
  schedule:
    - cron: '0 4 * * 5'   # weekly, Fri 04:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max movies to look up this run (0 = all)'
        required: false
        default: '0'

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  tvdb-movies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Fill movie posters from TheTVDB
        env:
          THETVDB_API_KEY: ${{ secrets.THETVDB_API_KEY }}
        run: |
          python tools/enrich_tvdb_movies.py --limit ${{ github.event.inputs.limit || '0' }} | tee tvdbmov.log
          echo "## TheTVDB movie posters" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -4 tvdbmov.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      - name: Publish catalog to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Persist title->poster cache
        run: |
          if [ -n "$(git status --porcelain tools/tvdb_movie_cache.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tools/tvdb_movie_cache.json
            git commit -m "tvdb-movies: refresh title->poster cache [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push race, retry $i"; sleep 5
            done
          fi

      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-db.yml
