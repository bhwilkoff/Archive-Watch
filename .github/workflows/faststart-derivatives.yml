name: Faststart derivative upgrade

# Monthly full pass that re-picks non-.ia.mp4 mpeg4/divx ORIGINAL movies to an
# Archive faststart .ia.mp4 derivative when one now exists, so slow-starting
# (moov-at-EOF) uploads become instant-start (#6, Decision 019 rationale).
#
# ALSO covers the strict verifier's needsFaststart=True set (H.264 moov-at-EOF
# films that AVFoundation rejects with -11829 — the owner's "resource unavailable
# on Apple" class): repair_derivatives.py's --faststart gate now treats any
# needsFaststart-flagged item as a candidate regardless of its stored format
# label, and swaps + clears the flag the moment Archive derives an .ia.mp4.
# A cheap targeted `--needs-faststart-only` step runs first so the flagged set is
# re-checked even if the full pass is throttled/interrupted. NOTE: an item whose
# ONLY derivative is the moov-at-EOF original itself (Archive skips deriving a
# second MP4 when the upload is already H.264) has nothing to swap to and stays
# flagged — that subset needs a generate-and-host faststart remux (not built).
#
# Cadence is monthly on purpose: measured yield is ~0.3% today because Archive
# hasn't backfilled most legacy remuxes yet — a daily pass would re-fetch the
# same ~12k items for almost nothing. Run monthly so value accrues as Archive
# derives more over time, without hammering the metadata API. The .ogv->MP4
# repair (the must-fix case) stays in the daily discover-content job.

on:
  schedule:
    - cron: '0 7 1 * *'   # 07:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      throttle:
        description: 'Per-request throttle (s)'
        required: false
        default: '0.15'
      max_minutes:
        description: 'Stop the full pass after this long so the catalog is still written'
        default: '180'

concurrency:
  group: catalog-writers     # serialise with the other catalog writers
  cancel-in-progress: false

jobs:
  faststart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write          # dispatch publish-db after the catalog updates
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Faststart re-pick (needsFaststart set first, then full pass)
        run: |
          # 1) Cheap targeted pass over the strict verifier's flagged -11829 set,
          #    so it is re-checked even if the full pass is throttled/interrupted.
          python tools/repair_derivatives.py --needs-faststart-only --skip-series \
            --throttle ${{ github.event.inputs.throttle || '0.15' }} \
            --max-minutes 60 \
            | tee faststart-flagged.log
          # 2) Full monthly pass (exotic-format originals + any flagged items).
          # Budgets, because both prior runs hit the 360-minute wall and were
          # reported as "cancelled" with the catalog never written.
          python tools/repair_derivatives.py --faststart --skip-series \
            --throttle ${{ github.event.inputs.throttle || '0.15' }} \
            --max-minutes ${{ github.event.inputs.max_minutes || '180' }} \
            | tee faststart.log
          echo "## Faststart pass" >> $GITHUB_STEP_SUMMARY
          echo '### needsFaststart set' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -3 faststart-flagged.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
          echo '### full pass' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -3 faststart.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      - name: Publish catalog to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gh_dispatch.sh publish-db.yml
