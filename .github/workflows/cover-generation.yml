name: Cover generation

# Generate REAL frame-extracted poster covers for art-less catalog items (Decision 023) so nothing
# falls back to the archive.org services/img thumbnail (owner 2026-06-29). Runs on a macOS runner
# (the Apple Vision CoverScorerCLI is macOS-only; this offloads the heavy ffmpeg batch off the
# owner's fanless Air — same rationale as the whisper CI pivot, Decision 039a).
#
# SPLIT INTO COMPUTE AND APPLY (Decision 066). This used to be one job that fetched the catalog,
# generated covers for ~51 minutes, and published — holding the `catalog-writers` lock the whole
# time. It was the single biggest steady holder of that lock: measured 2026-08-23, TMDb enrich
# waited 673 minutes in the queue to run a ONE-minute job behind holds like this one, and a
# pending writer can be DESTROYED by the next arrival while it waits (Decision 057). Now the
# generation runs with NO lock and emits a field-level delta; a short apply job takes the lock
# for ~2 minutes to merge onto a FRESHLY fetched catalog.
#
# Per run: fetch catalog (read-only) -> generate covers for the next N art-less, video-bearing
# items (popularity-first; batch_covers skips items that already have real/generated art, so the
# CATALOG is the resume state) -> upload to the archivewatch-covers archive.org item -> wire
# posterURL + artworkSource=generated locally -> extract the delta -> apply job merges + publishes.
#
# REQUIRED SECRETS (one-time, owner): IAS3_ACCESS_KEY + IAS3_SECRET_KEY (archive.org S3-like keys,
# https://archive.org/account/s3.php). Without them the upload step fails fast and nothing publishes.

on:
  schedule:
    - cron: '0 5 * * *'   # nightly 05:00 UTC (after the other catalog crons)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items to cover this run (0 = all remaining; keep modest for the 6h job cap)'
        required: false
        default: '300'
      workers:
        description: 'Concurrent ffmpeg workers'
        required: false
        default: '3'

jobs:
  covers:
    runs-on: macos-15
    # No catalog-writers group: this job never mutates shared state.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # frame_cover.py uses OpenCV (cv2) for the ffmpeg frame grab + crop/resize.
      # Headless wheel = no GUI/X deps; numpy comes transitively.
      - run: pip install requests opencv-python-headless

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Build the Apple Vision cover scorer (CoverScorerCLI)
        run: |
          cd tools/CoverScorerCLI && swift build -c release
          test -x .build/release/coverscorer && echo "coverscorer built"

      # Read-only: this is a download, and needs no lock.
      - name: Fetch catalog (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Snapshot the catalog (for the delta)
        run: python tools/catalog_delta.py snapshot --out /tmp/aw-before.json

      - name: Generate covers (popularity-first; skips items that already have art)
        # The budget stops the batch cleanly so the wiring + delta below always
        # run; the step timeout is a BACKSTOP for a hang the budget cannot
        # reach, and continue-on-error keeps it from failing a run whose work
        # still ships — the verdict step decides (Decision 093).
        id: gen
        continue-on-error: true
        timeout-minutes: 270
        run: |
          # pipefail so a batch_covers.py crash fails the step — `| tee` otherwise
          # masks the exit code and the run falsely goes green (then upload finds no manifest).
          set -o pipefail
          python tools/batch_covers.py \
            --limit ${{ github.event.inputs.limit || '300' }} \
            --workers ${{ github.event.inputs.workers || '3' }} \
            --max-minutes 240 | tee covers.log
          echo "## Cover generation" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -6 covers.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload covers to the archivewatch-covers item (IAS3)
        # always(): a budget-stopped or backstopped batch still made covers,
        # and uploading them is exactly the point of banking partial work.
        if: always()
        env:
          IAS3_ACCESS_KEY: ${{ secrets.IAS3_ACCESS_KEY }}
          IAS3_SECRET_KEY: ${{ secrets.IAS3_SECRET_KEY }}
        run: |
          if [ -z "$IAS3_ACCESS_KEY" ] || [ -z "$IAS3_SECRET_KEY" ]; then
            echo "::error::IAS3_ACCESS_KEY / IAS3_SECRET_KEY secrets are not set — add them in repo Settings → Secrets."
            exit 1
          fi
          python tools/upload_covers.py --item archivewatch-covers

      - name: Wire generated covers into the local catalog
        if: always()
        run: python tools/apply_covers.py

      - name: Extract what changed
        if: always()
        run: python tools/catalog_delta.py extract --snapshot /tmp/aw-before.json --out aw-deltas.json

      # Upload whatever was written, including after a timeout — the point of
      # the split is that a partial run is still worth keeping.
      - name: Keep the deltas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-deltas
          path: aw-deltas.json
          if-no-files-found: ignore

      - name: Fail only if the backstop fired AND nothing was produced
        if: always() && steps.gen.outcome == 'failure'
        run: |
          EMPTY=$(python3 -c "import json;d=json.load(open('aw-deltas.json'));print('yes' if not d.get('changes') and not d.get('removals') else 'no')" 2>/dev/null || echo yes)
          if [ "$EMPTY" = "no" ]; then
            echo "::warning::Cover generation hit its backstop timeout, but its covers were wired and shipped — not failing the run (Decision 093)."
          else
            echo "::error::Cover generation was killed by its backstop timeout and produced NOTHING."
            exit 1
          fi

  # The ONLY job holding catalog-writers, for ~2 minutes rather than the whole
  # compute. Merging onto a FRESHLY fetched catalog also preserves whatever
  # another writer published meanwhile.
  apply:
    needs: covers
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: catalog-writers
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --quiet requests
      - uses: actions/download-artifact@v4
        with:
          name: cover-deltas
        continue-on-error: true

      - name: Stop if nothing changed
        id: gate
        run: |
          EMPTY=$(python3 -c "import json;d=json.load(open('aw-deltas.json'));print('yes' if not d.get('changes') and not d.get('removals') else 'no')" 2>/dev/null || echo yes)
          if [ "$EMPTY" = "yes" ]; then
            echo "nothing to apply"; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch catalog
        if: steps.gate.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Apply the cover deltas
        if: steps.gate.outputs.go == 'yes'
        run: python tools/catalog_delta.py apply --deltas aw-deltas.json

      - name: Publish catalog to release
        if: steps.gate.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB + web index
        if: steps.gate.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gh_dispatch.sh publish-db.yml
