name: Rights audit (confirm)

# Copyright/rights audit (Decision 027). Runs ONLY the network-heavy confirmation
# phase here — fetch each modern PD-labelled item's OWN archive.org licenseurl +
# date, rescue genuine CC0/CC films, re-anchor wrong-dated old films. archive.org
# is unreachable from the local dev sandbox, so the confirm runs in CI where it is
# clean (same reason verify-matches.yml / color-classify.yml run here).
#
# This workflow does NOT hide anything. It publishes the ANNOTATED catalog
# (archiveLicense/archiveDate/rightsConfirmed added) back to the release and
# uploads tools/rejected_audit.csv as an artifact for human review. The actual
# `excluded=true` apply + DB rebuild is done after that review (locally or via a
# follow-up), so a wrong hide can be caught first.
#
# Resumable via `rightsConfirmed`; failed fetches stay unconfirmed and retry.

on:
  # Run proactively: new ingests add modern PD-labelled titles that must be
  # confirmed against their OWN archive.org licenseurl before publish-db's apply
  # step can hide the copyrighted ones. Resumable via rightsConfirmed, so a nightly
  # run only confirms what's new. (The apply itself runs every publish-db build.)
  schedule:
    - cron: '10 1 * * *'   # nightly, before validate-posters (02:15) + publish-db (04:30)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max risk items to confirm this run (0 = all)'
        required: false
        default: '0'
      workers:
        description: 'Concurrent archive.org fetches'
        required: false
        default: '12'

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write   # catalog_release.py publish uploads a release asset
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      # Judge the catalog the apps SEE: hand-corrected titles and years
      # (title/year_corrections.json) are applied by remediate, and the
      # Copyright Office check matches on title and year — until 2026-09-29 it
      # checked "Frankenstein Doblada Al Español", not Frankenstein (1931).
      - name: Remediate (apply hand corrections before judging)
        run: python tools/remediate_catalog.py | tail -3

      - name: Confirm rights via Archive licenseurl + date
        run: |
          python tools/audit_rights.py \
            --confirm \
            --workers ${{ github.event.inputs.workers || '12' }} \
            ${{ github.event.inputs.limit != '0' && format('--limit {0}', github.event.inputs.limit) || '' }} \
            | tee confirm.log
          echo "## Rights audit — confirm" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -4 confirm.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Corroborate licence-only titles (Wikidata + curated evidence)
        # Owner, 2026-09-25: "Unless we have evidence for CC or PD, an
        # uploader's word is not enough." A modern or undated title kept only
        # on its archive licence is hidden (uploader_licence_only) unless this
        # step finds independent evidence. Additive; never removes one.
        run: python tools/corroborate_licences.py | tail -2

      - name: Find verifiable copyright claims (Copyright Office renewals + Wikidata)
        # Owner, 2026-09-28: "If we have verifiable copyright claims on movies
        # or TV shows, we should work to remove those items from the database.
        # If we truly don't know about the copyright status, then they can
        # stay." Marks copyrightClaimEvidence (a record a reader can open);
        # audit_rights hides those as copyright_claim_evidence. Unknown stays.
        # Checked titles are re-checked after 90 days, so a first run is the
        # long one; the budget leaves the rest of the job its time.
        run: python tools/corroborate_copyright.py --budget-min 120 | tail -2

      - name: Report (what WOULD be rejected) + bucket summary
        run: |
          python tools/audit_rights.py --report-rejected tools/rejected_audit.csv | tee audit.log
          echo "## Rights audit — buckets" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; sed -n '1,30p' audit.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload rejected manifest for review
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected_audit
          path: tools/rejected_audit.csv

      - name: Publish annotated catalog to release
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish
