name: Word alignment index (#9 Phase B)

# Sentence Supercut Phase B: forced-align each captioned film's KNOWN caption to its audio
# (torchaudio MMS aligner, wav2vec2 — plain Linux, no Apple, no hallucination) and write a `words`
# table into subtitle.sqlite, so the macOS composer gets INSTANT frame-accurate word boundaries
# without a per-clip speech pass. Runs after subtitle-index (same concurrency group); resumable.

on:
  schedule:
    - cron: '0 11 * * *'   # after subtitle-index (07:00)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Films to align this run'
        default: '400'
      max_minutes:
        description: 'Stop aligning after this long so the publish step still runs'
        default: '240'

concurrency:
  group: subtitle-index           # share with subtitle-index.yml — both mutate subtitle.sqlite
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache the aligner model
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: mms-fa-aligner

      - name: Install torchaudio
        run: pip install torch torchaudio soundfile

      - name: Get the subtitle index
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download subtitle-index -p subtitle.sqlite.zz -O subtitle.sqlite.zz
          python3 -c "import zlib; open('subtitle.sqlite','wb').write(zlib.decompress(open('subtitle.sqlite.zz','rb').read(),-15))"
          # This step has no `|| true`, which is why it FAILED SAFELY twice while
          # the asset was missing and subtitle-index.yml rebuilt over it. The
          # baseline additionally guards the publish below against any other
          # cause of shrinkage.
          python tools/sqlite_publish_guard.py snapshot subtitle.sqlite --out .index_baseline.json

      # A BUDGET, not just a timeout. This job hit its 330-minute wall on every
      # one of its 15 runs — GitHub reports a timeout as "cancelled", so the run
      # list read as 15 cancellations and the workflow had never once completed.
      # Alignment commits per film, but the DB is only PUBLISHED at the end, so
      # being killed threw away every day's work. Stopping early lets the publish
      # step run and the next day resume from the `aligned` marker.
      - name: Align words
        # Backstop for when the budget cannot stop it — one hung request
        # inside a single item is how a 180-minute budget ran 360.
        # Fails the STEP, so the publish steps below still run.
        timeout-minutes: 270
        run: |
          python tools/build_word_index.py \
            --limit ${{ github.event.inputs.limit || '400' }} \
            --max-minutes ${{ github.event.inputs.max_minutes || '240' }} | tee words.log
          echo "## Word alignment" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -2 words.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publish updated index
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row.
        # always() so a killed compute step still publishes its work — but
        # NOT when the restore failed, or we would publish over a good index
        # with whatever happens to be on disk.
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/sqlite_publish_guard.py check subtitle.sqlite --baseline .index_baseline.json
          python3 -c "import zlib; d=open('subtitle.sqlite','rb').read(); c=zlib.compressobj(9,zlib.DEFLATED,-15); open('subtitle.sqlite.zz','wb').write(c.compress(d)+c.flush())"
          bash tools/gh_retry.sh gh release upload subtitle-index subtitle.sqlite.zz --clobber
