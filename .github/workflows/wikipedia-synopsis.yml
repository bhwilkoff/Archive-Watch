name: Wikipedia synopses

# Track B text quality: real English Wikipedia plot summaries for catalog items
# that have a Wikidata QID but no / a short synopsis (~2.3k films, incl. ones
# TMDb/OMDb can't reach). Runs on GitHub (Wikidata/Wikipedia reachable there).
# Catalog on the catalog-source release (Decision 018): fetch -> enrich ->
# remediate -> publish -> rebuild DB.

on:
  schedule:
    - cron: '0 2 * * 4'   # weekly, Thu 02:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items to enrich this run (0 = all candidates)'
        required: false
        default: '0'

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  synopsis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Enrich Wikipedia synopses
        run: |
          python tools/enrich_wikipedia_synopsis.py \
            --limit ${{ github.event.inputs.limit || '0' }} | tee wpsyn.log
          echo "## Wikipedia synopses" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -4 wpsyn.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      - name: Publish catalog to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gh_dispatch.sh publish-db.yml
