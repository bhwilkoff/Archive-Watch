name: Subtitle cue index (#9)

# Creation Studio #9 (Decision 042): parse every captioned film's WebVTT into subtitle.sqlite
# (tools/build_subtitle_index.py) so the macOS Text->Supercut searches spoken lines across the
# WHOLE catalog, not just the on-device popular-films sample. Published like clips.sqlite; the app
# downloads + inflates it (StockIndex pattern), falling back to the sample. Popularity-first,
# resumable; runs after subtitles land.

# CADENCE: measured +0 films; 5.5M cues already indexed (2026-08-11), so this runs
# weekly rather than daily — it was fetching a 140 MB catalog and taking
# the catalog-writers lock to find nothing. Raise it again if the backlog
# grows; the yield line in its own log is the signal.
on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Captioned films to add this run'
        default: '4000'

concurrency:
  group: subtitle-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Restore existing index (resumable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only the COMPRESSED index is published — the raw file passed GitHub's
          # 2 GiB asset limit and every upload 422'd, so nothing was published at
          # all from 2026-06 until this was found.
          gh release download subtitle-index -p subtitle.sqlite.zz -O subtitle.sqlite.zz \
            && python3 -c "import zlib; open('subtitle.sqlite','wb').write(zlib.decompress(open('subtitle.sqlite.zz','rb').read(),-15))" \
            || echo "first run — no existing index"

      - name: Build cue index
        run: |
          python tools/build_subtitle_index.py --limit ${{ github.event.inputs.limit || '4000' }} | tee sub.log
          echo "## Subtitle cue index" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -2 sub.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publish index
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Raw DEFLATE (wbits=-15), matching the catalog convention so the app reuses inflate.
          python3 -c "import zlib; d=open('subtitle.sqlite','rb').read(); c=zlib.compressobj(9,zlib.DEFLATED,-15); open('subtitle.sqlite.zz','wb').write(c.compress(d)+c.flush())"
          gh release view subtitle-index >/dev/null 2>&1 || \
            gh release create subtitle-index --title "Subtitle cue index" --notes "subtitle.sqlite for Creation Studio Supercut (#9)"
          bash tools/gh_retry.sh gh release upload subtitle-index subtitle.sqlite.zz --clobber
