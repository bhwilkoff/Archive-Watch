name: Free subtitles (SubSource)

# Decision 039 Phase 3: harvest English subtitles from the free SubSource API (by
# imdb id, title+year fallback), per film, with a last-cue-vs-runtime sync guard.
# Runs on GitHub's open-internet runners (so the provider host is reachable, unlike
# the dev sandbox) in the catalog-writers concurrency group (no clobbering CI).
# Builds the same VTT+HLS /subs assets the archive.org phase does, accumulates them
# into the subtitle-assets release, then republishes catalog + Pages + DB. Self-chains
# to drain the catalog over many runs; films attempted-but-not-found are marked
# freeSubsChecked so they aren't retried every run.

on:
  # Daily drain at ~the SubSource daily quota (~2,400 films/day = ~7,200 req/day / ~3
  # calls per film). A daily cron is the sustainable pace ceiling — bursting faster just
  # hits 429s. ~31,800 eligible films -> roughly two weeks to full coverage.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: 'subsource (workhorse) or subdl'
        required: false
        default: 'subsource'
      limit:
        description: 'Max films to attempt this run'
        required: false
        default: '2000'
      upgrade:
        description: 'Replace machine (whisper/asr) captions on popular titles'
        required: false
        default: 'false'

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  free-subs:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      # A FAILED restore used to be swallowed by `|| true`, leaving subs/ empty —
      # and the publish step below re-tars whatever is on disk, so one bad
      # download silently replaced the entire accumulated asset set with a single
      # run's output. That is the Decision-020 clobber shape; the same hole was
      # closed in subtitles.yml and missed here.
      - name: Fetch existing subtitle assets (/subs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p subs
          if gh release view subtitle-assets >/dev/null 2>&1; then
            if ! gh release download subtitle-assets -p 'subs.tar.gz' -O subs.tar.gz; then
              echo "::error::The subtitle-assets release exists but its tarball could not be downloaded."
              echo "::error::Continuing would republish a partial set over every accumulated asset."
              exit 1
            fi
            tar xzf subs.tar.gz && rm -f subs.tar.gz
          fi
          COUNT=$(find subs -type f | wc -l | tr -d ' ')
          echo "existing subs files: $COUNT"
          echo "SUBS_BEFORE=$COUNT" >> "$GITHUB_ENV"

      - name: Harvest subtitles
        env:
          SUBSOURCE_API_KEY: ${{ secrets.SUBSOURCE_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
        run: |
          # A scheduled run sweeps EVERY provider; a dispatch can name one.
          # "Already attempted" is per-provider, so SubDL now gets its own pass
          # over the ~83% SubSource has nothing for — before this it inherited
          # SubSource's sweep and had no targets at all.
          PROVIDERS="${{ github.event.inputs.provider }}"
          [ -n "$PROVIDERS" ] || PROVIDERS="subsource subdl"
          : > subs.log
          echo "## Free subtitles" >> $GITHUB_STEP_SUMMARY
          for P in $PROVIDERS; do
            echo "=== provider: $P ===" | tee -a subs.log
            python tools/free_subtitles.py \
              --provider "$P" \
              --limit ${{ github.event.inputs.limit || '2000' }} \
              --sleep 1.5 \
              ${{ github.event.inputs.upgrade == 'true' && '--upgrade' || '' }} | tee -a subs.log
            echo "### $P" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "targets|built|no-match|rejected|sync-reject" subs.log | tail -5 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      - name: Publish subtitle assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AFTER=$(find subs -type f | wc -l | tr -d ' ')
          if [ "${SUBS_BEFORE:-0}" -gt 0 ] && [ "$AFTER" -lt "${SUBS_BEFORE}" ]; then
            echo "::error::Refusing to publish a SHRUNKEN asset set ($AFTER < $SUBS_BEFORE)."
            exit 1
          fi
          echo "publishing $AFTER files (was ${SUBS_BEFORE:-0})"
          tar czf subs.tar.gz subs
          gh release view subtitle-assets >/dev/null 2>&1 || \
            gh release create subtitle-assets --title "Subtitle assets (rolling)" \
              --notes "VTT + HLS subtitle assets served to Pages at /subs (Decision 039)."
          bash tools/gh_retry.sh gh release upload subtitle-assets subs.tar.gz --clobber

      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      - name: Publish catalog to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Deploy Pages (/subs) + rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/gh_dispatch.sh deploy-pages.yml
          bash tools/gh_dispatch.sh publish-db.yml

      # Self-chain: free_subtitles prints "[subs] <prov>: N targets" = min(remaining,
      # limit). If N >= limit, the batch was full and more remain — queue the next run
      # (the catalog-writers concurrency group serializes it). When N < limit the
      # backlog is drained (attempted films are freeSubsChecked) and the chain stops.
      # Report remaining backlog. We deliberately do NOT immediately re-queue: one run
      # ~= the SubSource daily quota, so a same-day re-queue just 429-storms. The daily
      # cron (above) is the sustainable driver — it picks up the next batch tomorrow.
      # (Manual override: dispatch again by hand to burn a fresh day's quota.)
      - name: Report backlog
        run: |
          LIMIT="${{ github.event.inputs.limit || '2000' }}"
          # One line PER PROVIDER now — the backlog is drained only when every
          # provider is drained, so take the largest, not the first.
          N=$(grep -oE 'AWSUBS_TARGETS=[0-9]+' subs.log | grep -oE '[0-9]+' | sort -rn | head -1)
          echo "targets=$N limit=$LIMIT"
          if [ -n "$N" ] && [ "$N" -ge "$LIMIT" ]; then
            echo "Backlog remains (>= one batch) — the daily cron continues the drain."
          else
            echo "Backlog drained — fewer than one batch of eligible films remain."
          fi
