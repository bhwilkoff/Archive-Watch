name: Deploy Pages

# Publishes the site to GitHub Pages via Actions (Decision 029 §2.4 / 039) so we
# can host generated subtitle assets at /subs/ — archive.org sends no CORS, but
# Pages does (web <track>) and AVPlayer reads it (Apple HLS). The artifact is the
# repo working tree MINUS .git (identical to the old Pages-from-branch serving)
# PLUS /subs fetched from the subtitle-assets release. INERT until the owner flips
# Settings → Pages → Source: GitHub Actions.
#
# Triggers: every push to main (site/catalog-index/details changes) and after the
# subtitle enrichment run (new /subs). Manual dispatch for a forced redeploy.

on:
  push:
    branches: [main]
    # Only redeploy the website when WEB content changes. App/tooling/docs-only commits (the
    # native apps, pipeline scripts, design docs) don't touch the served site, so they must not
    # trigger a Pages deploy — a burst of such commits was racing the Pages deployment API
    # ("in progress deployment … cancel … first"). paths-IGNORE = deploy unless ALL changed
    # files are under these.
    paths-ignore:
      - 'ArchiveWatch/**'
      - 'ios/**'
      - 'android/**'
      - 'tools/**'
      - 'docs/**'
      - '**.xcconfig'
      - 'DECISIONS.md'
      - 'SCRATCHPAD.md'
      - 'CLAUDE.md'
      - 'PARITY.md'
  workflow_dispatch:
  workflow_run:
    workflows: ["Enrich subtitles"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Latest deploy wins (a static site only needs the newest); cancelling a superseded, still-
  # queued deploy also avoids the Pages-API "deployment in progress" collision when two overlap.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch subtitle assets (/subs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p subs
          if gh release view subtitle-assets >/dev/null 2>&1; then
            # The release exists, so its tarball MUST restore. Deploying
            # without it ships a site with ZERO subtitle files, and Pages then
            # serves 404.html as VTT with HTTP 200 — the app sees "subtitles"
            # that are an HTML page (measured 2026-08-09). An old site beats a
            # subtitle-less one, and deploys run many times a day, so a
            # refusal self-heals on the next trigger.
            bash tools/gh_retry.sh gh release download subtitle-assets -p 'subs.tar.gz' -O subs.tar.gz
            tar xzf subs.tar.gz && rm -f subs.tar.gz
          fi
          echo "subs files: $(find subs -type f | wc -l)"

      - name: Assemble site
        run: |
          # Mirror exactly what Pages-from-main served (whole tree minus .git),
          # plus the fetched /subs. Missing a path here would break the live site
          # on flip, so we copy everything rather than enumerate.
          mkdir _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/

      - name: Build share pages (/item/<id>, /series/<slug>)
        run: |
          # Every share URL the apps, the QR cards and the social programme
          # emit needs a real page with Open Graph tags behind it, or the link
          # falls through to 404.html and previews as nothing (measured
          # 2026-09-06). Generated into the artifact, never committed —
          # ~27,000 files is exactly the git bloat Decision 018 avoided.
          python3 tools/build_share_pages.py --out _site

          # A build that produced nothing is the failure this guard exists
          # for: the pages would silently revert to 404 while the deploy
          # stayed green. The floor is well under the real count (~26,700) so
          # ordinary catalog movement never trips it.
          n=$(find _site/item _site/series -name index.html 2>/dev/null | wc -l)
          echo "share pages: $n"
          if [ "$n" -lt 20000 ]; then
            echo "::error::only $n share pages built (expected >20000) — every"
            echo "::error::shared link would preview as nothing. Refusing to deploy."
            exit 1
          fi

      - name: Build the programme feed (/feed.xml, /feed.json)
        run: |
          # The one channel nobody else owns. Driven by social/posted.json, so
          # it is empty until the first account is connected and fills on its
          # own after that — an empty programme, not a broken feed.
          python3 tools/build_feed.py --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
