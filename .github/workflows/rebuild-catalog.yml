name: Rebuild catalog

on:
  schedule:
    # Mondays 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      seed_limit:
        description: 'Wikidata seed cap'
        required: false
        default: '800'
      per_shelf:
        description: 'Items per shelf'
        required: false
        default: '48'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write        # dispatch publish-db after the catalog updates
    # The catalog now lives on the catalog-source release (Decision 018), so
    # this job mutates a shared asset — serialise with the other writers.
    concurrency:
      group: catalog-writers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Build catalog
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: |
          node tools/build-catalog.mjs \
            --seed-from-wikidata \
            --seed-limit=${{ inputs.seed_limit || '800' }} \
            --per-shelf=${{ inputs.per_shelf || '48' }} \
            --concurrency=3

      - name: Stats summary
        run: |
          echo "## Catalog stats" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          jq '.stats' catalog.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # No PR — the catalog isn't in git. Publish straight to the release;
      # publish-db rebuilds the app's SQLite from it on its schedule.
      - name: Publish catalog to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-db.yml
