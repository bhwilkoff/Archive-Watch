name: Rebuild catalog

# Runs build-catalog.mjs, which produces a FRESH, small catalog (Wikidata seed +
# per-shelf query results). Its job in the autonomous pipeline is to seed new
# Wikidata films and REFRESH the dynamic shelf assignments weekly so Home shelves
# don't go stale (discover-content + ingest grow the catalog but don't assign
# shelves).
#
# SAFETY (2026-06-03): a scheduled run once silently OVERWROTE the full ~30k
# catalog down to ~1.1k because build-catalog.mjs writes a fresh catalog.json and
# the step published it as-is (the catalog lives on a Release, not git — Decision
# 018 — so no diff caught it). The "Merge build into full catalog" step below now
# makes the build ENRICHMENT-PRESERVING + ADDITIVE: it only adds new items and
# refreshes shelf assignments onto the full fetched catalog, with a shrink guard
# that aborts if the result would be smaller. So the weekly cron is safe to keep
# — the pipeline stays fully autonomous (Decisions 016-019).
on:
  schedule:
    # Mondays 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      seed_limit:
        description: 'Wikidata seed cap'
        required: false
        default: '800'
      per_shelf:
        description: 'Items per shelf'
        required: false
        default: '48'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write        # dispatch publish-db after the catalog updates
    # The catalog now lives on the catalog-source release (Decision 018), so
    # this job mutates a shared asset — serialise with the other writers.
    concurrency:
      group: catalog-writers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/catalog_release.py fetch
          # Keep the full fetched catalog so the build can be merged INTO it
          # (build-catalog.mjs overwrites catalog.json with a fresh small set).
          cp catalog.json /tmp/catalog_base.json

      - name: Build catalog
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: |
          node tools/build-catalog.mjs \
            --seed-from-wikidata \
            --seed-limit=${{ inputs.seed_limit || '800' }} \
            --per-shelf=${{ inputs.per_shelf || '48' }} \
            --concurrency=3

      - name: Merge build into full catalog (never shrink)
        run: |
          # Union the freshly-built items INTO the full fetched catalog. Aborts
          # if the result would be smaller than the base — guards against the
          # 2026-06-03 clobber where a small build replaced the whole catalog.
          python tools/merge_catalogs.py /tmp/catalog_base.json catalog.json catalog.json

      - name: Stats summary
        run: |
          echo "## Catalog stats" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          jq '.stats' catalog.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      # No PR — the catalog isn't in git. Publish straight to the release;
      # publish-db rebuilds the app's SQLite from it on its schedule.
      - name: Publish catalog to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gh_dispatch.sh publish-db.yml
