name: Enrich subtitles

# Scans each playable item's archive.org file list for caption files
# (.asr.srt / .srt / .vtt, language-tagged where present) and records them in
# the catalog's additive `captions` field (tools/enrich_subtitles.py). Phase 1
# source: archive.org's own (mostly ASR) captions — free, already hosted, no
# redistribution issue. Bounded per run; resumable via `captionsChecked`.
# Catalog lives on the release (Decision 018): fetch -> enrich -> publish -> DB.

on:
  schedule:
    - cron: '0 7 * * 4'   # weekly, Thu 07:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items to scan this run (0 = all)'
        required: false
        default: '8000'
      refresh:
        description: 'Re-check already-scanned items (true/false)'
        required: false
        default: 'false'
      build_assets:
        description: 'Build + publish web VTT / Apple HLS assets to /subs. ONLY after Pages→Actions is flipped (else subtitleHLS 404s).'
        required: false
        default: 'false'

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  subtitles:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Enrich subtitles (detect archive.org captions)
        run: |
          python tools/enrich_subtitles.py \
            --limit ${{ github.event.inputs.limit || '8000' }} \
            ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }} | tee subs.log
          echo "## Subtitle enrichment" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -3 subs.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      # Build the web VTT + Apple HLS assets and ACCUMULATE them into the
      # subtitle-assets release (each run only builds items missing subtitleHLS,
      # so fetch the prior set first and re-upload the union).
      - name: Fetch existing subtitle assets
        if: ${{ github.event.inputs.build_assets == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p subs
          if gh release view subtitle-assets >/dev/null 2>&1; then
            gh release download subtitle-assets -p 'subs.tar.gz' -O subs.tar.gz || true
            [ -f subs.tar.gz ] && tar xzf subs.tar.gz && rm -f subs.tar.gz
          fi

      - name: Build subtitle assets (VTT + HLS)
        if: ${{ github.event.inputs.build_assets == 'true' }}
        run: |
          python tools/build_subtitle_assets.py \
            --limit ${{ github.event.inputs.limit || '8000' }} | tee subsbuild.log
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -3 subsbuild.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publish subtitle assets to release
        if: ${{ github.event.inputs.build_assets == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar czf subs.tar.gz subs
          gh release view subtitle-assets >/dev/null 2>&1 || \
            gh release create subtitle-assets --title "Subtitle assets (rolling)" \
              --notes "VTT + HLS subtitle assets served to Pages at /subs (Decision 039)."
          gh release upload subtitle-assets subs.tar.gz --clobber

      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      - name: Publish catalog to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-db.yml

      # Self-chain: archive.org throttles runner IPs, so each run scans a bounded
      # batch (the `[subs] N items to scan` line = min(unchecked, limit)). If this
      # run scanned a FULL batch (N >= limit), unchecked items remain — queue the
      # next run (the catalog-writers concurrency group serializes it, so at most
      # one runs + one queued; no runaway). When a run scans fewer than `limit`
      # the backlog is drained and the chain stops; persistently-unreachable
      # items (never marked captionsChecked) are left for the weekly cron. Only
      # for build_assets campaigns (the active full drain), not the weekly scan.
      - name: Continue draining (self-chain)
        if: ${{ github.event.inputs.build_assets == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '8000' }}"
          SCANNED=$(grep -oE '\[subs\] [0-9]+ items to scan' subs.log | grep -oE '[0-9]+' | head -1)
          echo "scanned=$SCANNED limit=$LIMIT"
          if [ "$LIMIT" -gt 0 ] && [ -n "$SCANNED" ] && [ "$SCANNED" -ge "$LIMIT" ]; then
            echo "Full batch scanned — backlog remains; queuing next run."
            gh workflow run subtitles.yml -f limit="$LIMIT" -f refresh=false -f build_assets=true
          else
            echo "Backlog drained (scanned < limit) — chain complete."
          fi
