name: Auto-captions (Apple SpeechTranscriber, sharded macOS)

# Caption the ~27,000 sound-era films that have NO subtitles, centrally, so every
# viewer on every platform gets them — instead of each viewer downloading a whole
# film to transcribe it themselves (which is all the in-app action can do).
#
# The engine is tools/caption_gen_main.swift, compiled against the SHIPPED
# ArchiveWatch/Services/AutoCaptions.swift so the quality gate here is literally
# the same code the app uses and cannot drift from it.
#
# NOT Decision 039a again. That was whisper.cpp, retired by 039b for producing
# fluent, confident, WRONG dialogue on archival audio. Different engine
# (SpeechTranscriber, macOS 26); every result must pass CaptionQuality; and
# silent films are excluded by the SELECTOR — never offered to the recognizer —
# because fabricating dialogue over a silent film is the worst outcome available
# and is prevented by not running, not by inspecting afterwards.
#
# Measured 2026-08-09: a 29-minute film -> 771 cues in 26s including the audio
# pull (~66x realtime), so one runner clears several hundred films per run.
# macOS runners are free for this PUBLIC repo.
#
# SCHEDULE DISABLED 2026-08-10 — this cannot work on a GitHub runner, and the
# nightly run was burning ~1h15m and the catalog-writers lock to produce
# nothing. `tools/probe_speech_assets.swift` on macos-26 (run 31433486714):
#
#     supportedLocales: 0 · installedLocales: 0 · status(forModules): unsupported
#     assetInstallationRequest THREW "… is not subscribed to transcription.en"
#
# A hosted runner carries NO speech models and cannot install them, so every
# film is rejected: the 2026-08-10 run finished passed=0 rejected=4, and every
# earlier run reported the same thing behind a different error message. The
# measurement above was taken on a Mac that already HAD the model — which is
# exactly the mistake this pipeline was built on.
#
# It still works on a machine with the models (the owner's Mac), so this stays
# dispatchable rather than deleted. Reviving it centrally needs a runner that
# has them — a self-hosted Mac — not another retry here.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Films to attempt across all shards'
        required: false
        default: '2000'
      shards:
        description: 'Parallel macOS runners'
        required: false
        default: '4'
      max_minutes:
        description: 'Per-shard transcription budget'
        required: false
        default: '240'

# Only the PUBLISH job touches the catalog, so the shards do not hold the
# catalog-writers lock while they transcribe for hours.
concurrency:
  group: auto-captions
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --quiet requests
      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch
      - id: plan
        run: |
          N='${{ github.event.inputs.shards || '4' }}'
          python tools/auto_captions.py select \
            --shards "$N" \
            --limit ${{ github.event.inputs.limit || '2000' }} \
            --out work | tee select.log
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($N))))")" >> "$GITHUB_OUTPUT"
          echo '## Auto-caption selection' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -3 select.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: caption-work
          path: work/

  transcribe:
    needs: select
    runs-on: macos-26
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.select.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: caption-work
          path: work
      - name: Install ffmpeg
        run: brew install ffmpeg || true
      - name: Build the generator against the shipped engine
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcrun swiftc -O \
            ArchiveWatch/ArchiveWatch/Services/AutoCaptions.swift \
            tools/caption_gen_main.swift -o captiongen
          sw_vers
      - name: Transcribe shard ${{ matrix.shard }}
        # Backstop for when the budget cannot stop it — one hung request
        # inside a single item is how a 180-minute budget ran 360.
        # Fails the STEP, so the publish steps below still run.
        timeout-minutes: 270
        run: |
          mkdir -p generated
          ./captiongen "work/work-${{ matrix.shard }}.json" generated \
            "generated/report-${{ matrix.shard }}.json" \
            --max-minutes ${{ github.event.inputs.max_minutes || '240' }} | tee cap.log
          echo "## Shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -4 cap.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: captions-${{ matrix.shard }}
          path: generated/

  publish:
    needs: transcribe
    if: always()
    runs-on: ubuntu-latest
    # ONLY this job mutates the catalog, and it is short.
    concurrency:
      group: catalog-writers
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --quiet requests
      - uses: actions/download-artifact@v4
        with:
          pattern: captions-*
          merge-multiple: true
          path: generated
      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      # Same restore/shrink discipline as the other subtitle workflows: a failed
      # restore must not let the publish step replace every accumulated asset
      # with one run's output (the Decision-020 clobber shape).
      - name: Fetch existing subtitle assets (/subs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p subs
          if gh release view subtitle-assets >/dev/null 2>&1; then
            if ! gh release download subtitle-assets -p 'subs.tar.gz' -O subs.tar.gz; then
              echo "::error::subtitle-assets exists but its tarball could not be downloaded."
              exit 1
            fi
            tar xzf subs.tar.gz && rm -f subs.tar.gz
          fi
          echo "SUBS_BEFORE=$(find subs -type f | wc -l | tr -d ' ')" >> "$GITHUB_ENV"

      # ACCURACY GATE, run before anything is published. CaptionQuality rejects a
      # recognizer failing VISIBLY; it cannot see a transcript that is fluent and
      # WRONG, which is the exact failure that retired the whisper pipeline. So
      # every run also re-transcribes a handful of films that ALREADY have human
      # subtitles and compares against them, with a different-film negative
      # control printed alongside — because a metric that cannot tell two films
      # apart would prove nothing. Measured 2026-08-09: same film 0.89, control
      # 0.30. If that separation ever collapses, this fails and nothing ships.
      - name: Accuracy check against human subtitles
        id: accuracy
        continue-on-error: true
        run: |
          if ls truth/*/en.vtt >/dev/null 2>&1; then
            python tools/verify_generated_captions.py --machine truth \
              --report accuracy.csv | tee accuracy.log
            echo '## Caption accuracy vs human subtitles' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -8 accuracy.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no ground-truth batch in this run"
          fi

      - name: Refuse to publish if the accuracy check failed
        if: steps.accuracy.outcome == 'failure'
        run: |
          echo "::error::The generated captions did not match human subtitles for "
          echo "::error::films where both exist. Nothing published."
          exit 1

      - name: Publish generated captions
        run: |
          python tools/auto_captions.py publish --subs-in generated | tee publish.log
          echo '## Auto-captions published' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -3 publish.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish subtitle assets to release
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AFTER=$(find subs -type f | wc -l | tr -d ' ')
          if [ "${SUBS_BEFORE:-0}" -gt 0 ] && [ "$AFTER" -lt "${SUBS_BEFORE}" ]; then
            echo "::error::Refusing to publish a SHRUNKEN asset set ($AFTER < $SUBS_BEFORE)."
            exit 1
          fi
          echo "publishing $AFTER files (was ${SUBS_BEFORE:-0})"
          tar czf subs.tar.gz subs
          bash tools/gh_retry.sh gh release upload subtitle-assets subs.tar.gz --clobber

      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py
      - name: Publish catalog to release
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish
      - name: Deploy Pages (/subs) + rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/gh_dispatch.sh deploy-pages.yml
          bash tools/gh_dispatch.sh publish-db.yml
