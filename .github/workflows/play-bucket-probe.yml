# A one-off diagnostic, run by hand. It answers ONE question that cannot be
# answered from a laptop: what objects does the Play reports bucket actually
# hold, and when was each last written? The bucket id is a secret, so the probe
# must run where the secret is. It prints object NAMES and TIMES only, and
# redacts the bucket id itself.
name: Play bucket probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the reader's dependencies
        run: pip install --quiet google-auth requests
      - name: List the bucket
        env:
          PLAY_REPORTS_BUCKET: ${{ secrets.PLAY_REPORTS_BUCKET }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        # `| tee` makes the STEP's status tee's, so the first run of this
        # probe died on a missing module and the job still went green — the
        # green-run-that-did-nothing this repo keeps paying for. pipefail makes
        # the probe's own exit code the step's.
        run: |
          set -o pipefail
          python3 tools/play_bucket_probe.py | tee -a "$GITHUB_STEP_SUMMARY"
