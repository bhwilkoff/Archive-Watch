name: Backfill film metadata

# Phase 1 of docs/METADATA-EXPANSION.md (Decision 046): pull keywords, AKA/original titles, full
# crew, cast person IDs, studios, franchise, tagline, release date (TMDb) + awards (OMDb) into the
# catalog so search/filter/discovery need no runtime API call. One TMDb detail call per matched
# film; resumable (metaSource marker). After the first full pass, daily runs only touch new items.

on:
  schedule:
    - cron: '47 3 * * *'      # clear of the cron wave (omdb 02:17, tmdb 03:43, language 03:37)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cap items this run (0 = all remaining)'
        default: '0'
      refresh:
        description: 're-enrich items already done (true/false)'
        default: 'false'

concurrency:
  group: catalog-writers      # serialize with every catalog-mutating workflow (Decision 018/020)
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Backfill metadata (TMDb + OMDb)
        id: fill
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          if [ -z "$TMDB_BEARER_TOKEN" ]; then
            echo "TMDB_BEARER_TOKEN not set — skipping (not an error)."
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python tools/backfill_metadata.py \
            ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }} \
            ${{ github.event.inputs.limit != '0' && format('--limit {0}', github.event.inputs.limit) || '' }} \
            | tee meta.log
          if grep -qE 'DONE filled=0 ' meta.log; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "## Backfill metadata" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -4 meta.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish catalog to release
        if: steps.fill.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB
        if: steps.fill.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gh_dispatch.sh publish-db.yml
