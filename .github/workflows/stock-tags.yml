name: Stock semantic tags (#6)

# Creation Studio #6: semantic SHOT tags via OPEN-SOURCE CLIP zero-shot (tools/tag_stock_shots.py)
# on a plain Linux runner — NO Apple Vision, no macOS, no in-app model. Reuses the frames the stock
# pipeline already detects: grabs each shot's mid-frame (ffmpeg) and tags it against a curated
# stock-footage vocabulary, appending to the `tags` column StockIndex already searches with LIKE.
# Runs after stock-index (same concurrency group, so they never clobber clips.sqlite); resumable.

on:
  schedule:
    - cron: '0 9 * * *'   # after stock-index (05:00) has added shots
  workflow_dispatch:
    inputs:
      limit:
        description: 'Shots to tag this run'
        default: '4000'
      max_minutes:
        description: 'Stop tagging after this long so the publish step still runs'
        default: '240'

concurrency:
  group: stock-index            # share with stock-index.yml — both mutate clips.sqlite
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache the CLIP model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: openclip-vit-b-32

      - name: Install CLIP
        run: pip install open-clip-torch

      - name: Get the shot index
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # From the .zz — the raw clips.sqlite asset is retired (Decision 089:
        # nothing consumes it, and re-uploading a large raw member is the
        # failure that vanished the subtitle-index assets). A missing release
        # is a hard fail here, not a first run: tags need an existing index.
        run: |
          bash tools/gh_retry.sh gh release download stock-index -p clips.sqlite.zz -O clips.sqlite.zz
          python3 -c "import zlib; open('clips.sqlite','wb').write(zlib.decompress(open('clips.sqlite.zz','rb').read(),-15))"
          rm -f clips.sqlite.zz
          python3 tools/sqlite_publish_guard.py snapshot clips.sqlite --out .stock_baseline.json

      - name: Tag shots
        # Backstop for when the budget cannot stop it — one hung request
        # inside a single item is how a 180-minute budget ran 360.
        # continue-on-error: the timeout is a BACKSTOP, not the verdict. The
        # publish below still ships whatever was tagged; red is reserved for a
        # run with nothing to show — the verdict step decides (Decision 093).
        id: tag
        continue-on-error: true
        timeout-minutes: 270
        run: |
          # A BUDGET, not just a timeout: this job hit its wall (281m, 330m) and
          # was reported as "cancelled", losing the whole run. Tagging commits
          # every 100 shots and is resumable, so stopping early lets the publish
          # step run and the next day continues.
          python tools/tag_stock_shots.py \
            --limit ${{ github.event.inputs.limit || '4000' }} \
            --max-minutes ${{ github.event.inputs.max_minutes || '240' }} | tee tag.log
          echo "## Stock semantic tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -2 tag.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publish updated index
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row — but never when the RESTORE failed
        # (Decision 089: publishing over a good index with whatever is on
        # disk is how the word index was destroyed).
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/sqlite_publish_guard.py check clips.sqlite --baseline .stock_baseline.json
          python3 -c "import zlib; d=open('clips.sqlite','rb').read(); c=zlib.compressobj(9,zlib.DEFLATED,-15); open('clips.sqlite.zz','wb').write(c.compress(d)+c.flush())"
          # ONLY the .zz (Decision 089) — and retire the stale raw member left
          # by pre-094 publishes; once gone the delete is a no-op.
          bash tools/gh_retry.sh gh release upload stock-index clips.sqlite.zz --clobber
          gh release delete-asset stock-index clips.sqlite -y 2>/dev/null || true

      - name: Fail only if the backstop fired AND nothing was produced
        # "changed: none" means the index is identical to what was restored —
        # a killed run with nothing to show, which IS broken. A killed run
        # that tagged shots did its job; a warning records the backstop
        # firing without an alert email (Decision 093).
        if: always() && steps.tag.outcome == 'failure' && steps.restore.outcome == 'success'
        run: |
          if python3 tools/sqlite_publish_guard.py check clips.sqlite --baseline .stock_baseline.json | grep -q 'changed: none'; then
            echo "::error::Tag shots was killed by its backstop timeout and produced NOTHING."
            exit 1
          fi
          echo "::warning::Tag shots hit its backstop timeout, but its work was published — not failing the run (Decision 093)."
