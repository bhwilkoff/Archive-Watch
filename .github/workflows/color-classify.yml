name: Color / B&W classification

# Classify each playable item's video as colour or black-and-white by sampling
# frames (Decision 025). ffmpeg signalstats saturation; threshold 8.
#
# SPLIT INTO COMPUTE AND COMMIT. This used to be one job that fetched the
# catalog, classified for the best part of an hour, and published — holding the
# `catalog-writers` lock the whole time. Twenty-eight workflows share that one
# lock, and GitHub keeps only ONE pending run per group, so a newer arrival
# DESTROYS the older (Decision 057). Five workflows alone were demanding ~10.7
# hours of exclusive lock per day to perform about ten minutes of mutation.
#
# Now the long half runs with NO lock and writes its results to a deltas file as
# they arrive; a second, short job takes the lock only to merge and publish.
# Three things fall out of that:
#
#   * The lock is held for ~2 minutes instead of ~52, so supersession becomes
#     rare rather than routine.
#   * A killed compute job loses only what it had not yet written, because the
#     deltas are appended as it goes — not rescued afterwards by `if: always()`.
#   * The merge lands on a FRESHLY fetched catalog, so anything another writer
#     published meanwhile survives. The old shape republished a whole catalog
#     read an hour earlier, which could only be safe BECAUSE it held the lock.

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Items to classify this run'
        required: false
        default: '1200'
      workers:
        description: 'Parallel ffmpeg probes'
        required: false
        default: '10'
      recheck_disputed:
        description: 'Re-measure only the films split into two cards by a colour disagreement'
        required: false
        default: 'false'

jobs:
  classify:
    runs-on: ubuntu-latest
    # No catalog-writers group: this job never mutates shared state.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --quiet requests
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Read-only: this is a download, and needs no lock.
      - name: Fetch catalog (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      # A film whose two copies disagree on colour shows up TWICE on the
      # shelves (Decision 084). Those are the readings worth spending a probe
      # on, and there are ~70 of them — so this re-measures exactly those
      # rather than sweeping 30,000 items to settle 70.
      - name: Re-measure the disputed readings
        if: github.event.inputs.recheck_disputed == 'true'
        run: |
          python tools/audit_color_disputes.py --catalog catalog.json \
            --ids-out disputed.txt | tail -5
          [ -s disputed.txt ] || { echo "no disputes"; exit 0; }
          # PATIENT on purpose. The first two passes reported most of these
          # "unreadable"; probing one by hand answered fine after 106 seconds to
          # open, so the 90s default was measuring our own budget rather than
          # the film. A targeted set is small enough to wait for.
          python tools/classify_color.py --ids-file disputed.txt --workers 4 \
            --frame-timeout 240 --deltas-out color-deltas.jsonl | tail -3

      - name: Classify color / B&W
        if: github.event.inputs.recheck_disputed != 'true'
        timeout-minutes: 170
        run: |
          python tools/classify_color.py \
            --limit ${{ github.event.inputs.limit || '1200' }} \
            --workers ${{ github.event.inputs.workers || '10' }} \
            --deltas-out color-deltas.jsonl | tee color.log
          echo '## Colour classification' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -3 color.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Upload whatever was written, including after a timeout — the point of
      # appending as we go is that a partial run is still worth keeping.
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: color-deltas
          path: color-deltas.jsonl
          if-no-files-found: ignore

  apply:
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The ONLY job that touches the catalog, and it is short.
    concurrency:
      group: catalog-writers
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --quiet requests
      - uses: actions/download-artifact@v4
        with:
          name: color-deltas
        continue-on-error: true

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Apply the classifications
        run: |
          if [ ! -s color-deltas.jsonl ]; then
            echo "no deltas to apply"; exit 0
          fi
          python tools/classify_color.py --apply-deltas color-deltas.jsonl

      - name: Publish catalog to release
        # Publish what finished; a killed compute job must not discard it.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s color-deltas.jsonl ] || { echo "nothing applied; not republishing"; exit 0; }
          python tools/catalog_release.py publish

      - name: Rebuild app DB
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s color-deltas.jsonl ] || { echo "nothing applied; not rebuilding"; exit 0; }
          bash tools/gh_dispatch.sh publish-db.yml
