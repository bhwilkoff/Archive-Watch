name: Match unmatched films

# Decision 046 coverage: recover the canonical match for unmatched films by searching TMDb/OMDb with
# the CLEANED title + archiveID slug, year-corroborated (Decision 026). Gives them an authoritative
# title + poster + metadata. Resumable (matchAttempted). Weekly + manual.
on:
  schedule:
    # Moved into the evening window (2026-07-19): every catalog workflow shares
    # the `catalog-writers` group, and GitHub keeps only ONE pending run per
    # group — a newer arrival supersedes an older PENDING one, so a job that
    # queues behind a busy slot is cancelled before it ever starts. Measured
    # cancellation rates over the last 20 runs: detect-trailers 75%,
    # check-liveness 50%, match-unmatched 33%, free-subtitles 30%,
    # subtitles 25% — while every workflow in a quiet slot sat at 0%.
    # This window is clear of color-classify (00/08/16 UTC) and of the daily
    # check-liveness run (13:00 + up to ~2h). Keep these staggered.
    - cron: '0 21 * * 1'      # weekly Mon, clear of the daily cron wave
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cap items this run (0 = all remaining)'
        default: '0'
concurrency:
  group: catalog-writers
  cancel-in-progress: false
jobs:
  match:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: pip install requests
      - name: Fetch catalog
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python tools/catalog_release.py fetch
      - name: Match unmatched (TMDb + OMDb, year-corroborated)
        id: m
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          if [ -z "$TMDB_BEARER_TOKEN" ]; then echo "no token — skip"; echo "changed=false" >>"$GITHUB_OUTPUT"; exit 0; fi
          python tools/match_unmatched.py ${{ github.event.inputs.limit != '0' && format('--limit {0}', github.event.inputs.limit) || '' }} | tee m.log
          grep -qE 'DONE tmdb=0 omdb=0 wikidata=0 ' m.log && echo "changed=false" >>"$GITHUB_OUTPUT" || echo "changed=true" >>"$GITHUB_OUTPUT"
          echo "## Match unmatched"; echo '```' >>"$GITHUB_STEP_SUMMARY"; tail -3 m.log >>"$GITHUB_STEP_SUMMARY"; echo '```' >>"$GITHUB_STEP_SUMMARY"
      - name: Publish + rebuild
        if: steps.m.outputs.changed == 'true'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python tools/catalog_release.py publish && bash tools/gh_dispatch.sh publish-db.yml
