name: Canonical TV rebuild

# Weekly rebuild of TV around the canonical TVmaze spine (Decision 016).
# This is the expensive, restructuring pass — it resolves every show to
# TVmaze, maps our Archive items onto canonical episodes, re-picks MP4
# derivatives, reconciles the catalog cards, and reclassifies whole-show
# singles. Because it deletes/rewrites hundreds of series/*.json and moves
# ~1k cards, it opens a PR for review rather than committing to main.
#
# The daily discover-content workflow feeds this by growing
# shared/editorial/tv_discovery.json; this drains it into canonical series.

on:
  schedule:
    # Sundays 06:00 UTC — before the Monday catalog refresh.
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      tv_discover_per_collection:
        description: 'Deep TV discovery: items per collection/subject'
        required: false
        default: '1500'
      throttle:
        description: 'Per-request throttle (s) for TVmaze/Archive'
        required: false
        default: '0.3'

concurrency:
  group: catalog-writers      # serialise with the daily writers
  cancel-in-progress: false

jobs:
  canonical-tv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write        # dispatch publish-db after the catalog updates
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests

      # Catalog lives on the catalog-source release (Decision 018). Pull it
      # local so reconcile/build can read + mutate it; republished at the end.
      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Deep TV discovery
        run: |
          python tools/discover_tv_shows.py \
            --per-collection ${{ github.event.inputs.tv_discover_per_collection || '1500' }} \
            | tee tvdisc.log

      # Exclude orphan-episode DUPLICATES (an episode already mapped in a spine)
      # BEFORE the canonical build, so build_canonical_tv's orphan-fold-in skips
      # them (excluded) instead of pooling them as duplicate "extras" in the
      # spine. New (non-duplicate) episodes are left for the fold-in to map.
      - name: Dedupe orphan episodes
        run: python tools/dedupe_orphan_episodes.py --apply | tee dedupe.log

      - name: Build canonical TV (TVmaze spine + Archive map + MP4 re-pick)
        run: |
          python tools/build_canonical_tv.py \
            --throttle ${{ github.event.inputs.throttle || '0.3' }} \
            | tee tvbuild.log

      # build_canonical_tv rewrites series/*.json from TVmaze, which RESETS posters
      # to TVmaze stills. Re-apply the professional TheTVDB posters/cast on top
      # (upgrade-only) BEFORE reconcile builds the catalog cards, so a rebuild
      # never silently downgrades TV art. No-op without the THETVDB_API_KEY secret.
      - name: Re-apply TheTVDB posters/cast to series
        env:
          THETVDB_API_KEY: ${{ secrets.THETVDB_API_KEY }}
        run: python tools/enrich_tvdb_tv.py | tail -5

      - name: Reconcile catalog TV cards
        run: |
          python tools/reconcile_tv_catalog.py | tee tvreconcile.log

      - name: Repair any remaining unplayable derivatives
        run: |
          python tools/repair_derivatives.py | tee tvrepair.log

      - name: Summary
        run: |
          echo "## Canonical TV rebuild" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '--- discovery ---'  >> $GITHUB_STEP_SUMMARY; tail -6 tvdisc.log >> $GITHUB_STEP_SUMMARY
          echo '--- build ---'      >> $GITHUB_STEP_SUMMARY; tail -4 tvbuild.log >> $GITHUB_STEP_SUMMARY
          echo '--- reconcile ---'  >> $GITHUB_STEP_SUMMARY; tail -6 tvreconcile.log >> $GITHUB_STEP_SUMMARY
          echo '--- repair ---'     >> $GITHUB_STEP_SUMMARY; tail -3 tvrepair.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Commit the git-tracked TV outputs straight to main. With catalog.json
      # out of git (Decision 018) the diff is now just series/*.json spines +
      # the discovery queue + report — small, reviewable in history, and free
      # of the giant-diff PR-creation 500s that used to fail this job. Series
      # JSON ships to Pages; deletions (mismaps) are committed via `git add -A`.
      - name: Commit TV series to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A series/ \
                  shared/editorial/tv_discovery.json \
                  shared/editorial/tv_rebuild_report.json
          if git diff --cached --quiet; then
            echo "No series changes (catalog still published below)."
            exit 0
          fi
          git commit -m "Canonical TV rebuild (${{ github.run_id }})"
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed (attempt $attempt)"; break; fi
            echo "push rejected; rebasing onto latest main (attempt $attempt)…"
            git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null; exit 1; }
            sleep $((RANDOM % 5 + 2))
          done

      # Republish the mutated catalog to the catalog-source release; publish-db
      # rebuilds the app's SQLite from it (series push above also triggers it).
      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      - name: Publish catalog to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      # A bot (GITHUB_TOKEN) push does NOT trigger publish-db's `on: push`
      # (GitHub loop-prevention), so dispatch it explicitly to rebuild the
      # app's SQLite from the catalog we just published.
      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-db.yml
