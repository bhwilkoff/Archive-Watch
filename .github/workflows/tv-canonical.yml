name: Canonical TV rebuild

# Weekly rebuild of TV around the canonical TVmaze spine (Decision 016).
# This is the expensive, restructuring pass — it resolves every show to
# TVmaze, maps our Archive items onto canonical episodes, re-picks MP4
# derivatives, reconciles the catalog cards, and reclassifies whole-show
# singles. Because it deletes/rewrites hundreds of series/*.json and moves
# ~1k cards, it opens a PR for review rather than committing to main.
#
# The daily discover-content workflow feeds this by growing
# shared/editorial/tv_discovery.json; this drains it into canonical series.

on:
  schedule:
    # Sundays 06:00 UTC — before the Monday catalog refresh.
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      tv_discover_per_collection:
        description: 'Deep TV discovery: items per collection/subject'
        required: false
        default: '1500'
      throttle:
        description: 'Per-request throttle (s) for TVmaze/Archive'
        required: false
        default: '0.3'

concurrency:
  group: catalog-writers      # serialise with the daily writers
  cancel-in-progress: false

jobs:
  canonical-tv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests

      - name: Deep TV discovery
        run: |
          python tools/discover_tv_shows.py \
            --per-collection ${{ github.event.inputs.tv_discover_per_collection || '1500' }} \
            | tee tvdisc.log

      - name: Build canonical TV (TVmaze spine + Archive map + MP4 re-pick)
        run: |
          python tools/build_canonical_tv.py \
            --throttle ${{ github.event.inputs.throttle || '0.3' }} \
            | tee tvbuild.log

      - name: Reconcile catalog TV cards
        run: |
          python tools/reconcile_tv_catalog.py | tee tvreconcile.log

      - name: Repair any remaining unplayable derivatives
        run: |
          python tools/repair_derivatives.py | tee tvrepair.log

      - name: Summary
        run: |
          echo "## Canonical TV rebuild" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '--- discovery ---'  >> $GITHUB_STEP_SUMMARY; tail -6 tvdisc.log >> $GITHUB_STEP_SUMMARY
          echo '--- build ---'      >> $GITHUB_STEP_SUMMARY; tail -4 tvbuild.log >> $GITHUB_STEP_SUMMARY
          echo '--- reconcile ---'  >> $GITHUB_STEP_SUMMARY; tail -6 tvreconcile.log >> $GITHUB_STEP_SUMMARY
          echo '--- repair ---'     >> $GITHUB_STEP_SUMMARY; tail -3 tvrepair.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # create-pull-request pushes the branch reliably but its PR-creation API
      # call intermittently 500s ("Server Error") on this repo's very large
      # diff (95 MB catalog.json + 100k+ changed lines). Don't let that flaky
      # call fail the whole run — a fallback below guarantees the PR exists.
      - name: Open PR if changed
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Weekly canonical TV rebuild"
          title: "Canonical TV rebuild — ${{ github.run_id }}"
          branch: tv-canonical/${{ github.run_id }}
          add-paths: |
            catalog.json
            ArchiveWatch/ArchiveWatch/catalog.json
            series/**
            shared/editorial/tv_discovery.json
            shared/editorial/tv_rebuild_report.json
          body: |
            Auto-generated by `.github/workflows/tv-canonical.yml` (Decision 016).

            Restructures TV around the canonical TVmaze spine. Review the run
            summary: confirm the canonical series count and reclassification
            totals look sane before merging. A large drop in series count or a
            spike in reclassifications may mean TVmaze changed or a discovery
            feed went wrong.

            Merging ships the updated series JSON to GitHub Pages (served at
            runtime by SeriesStore) and the new catalog cards to all app
            instances on next launch.

      # Fallback: if the branch was pushed but the PR-create API call 500'd,
      # open the PR with gh (a plain API call that doesn't ship the diff, so it
      # succeeds regardless of diff size). No-op when no branch / PR already
      # exists. This is what keeps the run green on the transient Server Error.
      - name: Ensure PR exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="tv-canonical/${{ github.run_id }}"
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "No '$branch' branch pushed — no changes to open a PR for."
            exit 0
          fi
          existing=$(gh pr list --head "$branch" --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $branch."
            exit 0
          fi
          gh pr create --head "$branch" --base main \
            --title "Canonical TV rebuild — ${{ github.run_id }}" \
            --body "Auto-generated canonical TV rebuild (Decision 016). Opened by the fallback step after the create-pull-request API call failed; the branch content is identical. Review series count + reclassification totals before merging."
          echo "Opened PR for $branch via fallback."
