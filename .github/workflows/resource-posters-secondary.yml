name: Re-source posters (secondary — TVDB / Wikipedia / Wikidata)

# Re-source professional posters from SECONDARY public sources — TheTVDB,
# English-Wikipedia film-infobox images, and Wikidata P18 (Commons) — for the
# ~6,070 feature/silent/animation FILMS still on a frame-still / dead / no poster
# that TMDb does NOT cover (resource_posters_tmdb.py can only help id-anchored
# films TMDb has art for). STRICT identity-anchored matching: imdb/tmdb → QID is
# authoritative; TVDB + title-only QID are corroborated by year; every candidate
# poster URL is proven LIVE before adoption. Abstain-over-wrong — the frame still
# is kept whenever nothing safe is found.
#
# Scheduled DAILY at 14:00 UTC — the emptiest catalog-writers window (no daily
# catalog cron runs 14:00–01:00 UTC), so this ~4–5h run never blocks the daily
# publish wave that shares the catalog-writers concurrency group. Reviewed clean
# on run 30018358797 (limit=500: 93 upgraded, 0 dead posters adopted, abstains
# firing correctly) before promotion — exactly like resource-posters.yml was.
#
# The default limit is a CONSERVATIVE 450: the tool is network-bound (~35s/item on
# Wikidata SPARQL + Wikimedia throttling) and only persists on the FINAL publish,
# so a run must finish well under the GitHub 6h job wall or it saves nothing.
# 450 ≈ 4h20m (≈1h40m margin). Raise manually only for a one-off you'll watch.

on:
  schedule:
    - cron: '0 14 * * *'   # daily 14:00 UTC — clear of the 01:00–13:00 daily cron wave
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items to attempt (0 = all; keep <=500 to stay under the 6h wall)'
        required: false
        default: '450'
      reprobe_days:
        description: 'Skip items probed within this many days'
        required: false
        default: '30'
      sleep:
        description: 'Seconds between items (Wikidata/Commons/TVDB rate-limit courtesy)'
        required: false
        default: '0.4'
      max_minutes:
        description: 'Stop starting items after this long and publish (bounds the catalog-writers lock hold)'
        required: false
        default: '75'
      dry_run:
        description: 'Resolve + report only, write nothing'
        required: false
        default: 'false'

jobs:
  resource-posters-secondary:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # publish updated catalog (release) — no git commit here
      actions: write     # dispatch publish-db after the catalog updates
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch


      - name: Record the catalog before we touch it

        run: python tools/catalog_delta.py snapshot --out /tmp/aw-before.json

      - name: Re-source posters from secondary sources
        # Backstop for when the budget cannot stop it — one hung request
        # inside a single item is how a 180-minute budget ran 360.
        # Fails the STEP, so the publish steps below still run.
        timeout-minutes: 105
        env:
          # tvdb_lib reads THETVDB_API_KEY from the environment (verified).
          # The tool still runs (Wikipedia/Wikidata) if the key is absent —
          # TVDB is simply disabled, so a missing secret is NOT an error.
          THETVDB_API_KEY: ${{ secrets.THETVDB_API_KEY }}
        run: |
          python tools/resource_posters_secondary.py \
            --limit ${{ github.event.inputs.limit || '450' }} \
            --reprobe-days ${{ github.event.inputs.reprobe_days || '30' }} \
            --sleep ${{ github.event.inputs.sleep || '0.4' }} \
            --max-minutes ${{ github.event.inputs.max_minutes || '75' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            | tee resource-posters-secondary.log

      - name: Stats summary
        if: hashFiles('resource-posters-secondary.log') != ''
        run: |
          echo "## Re-source posters (secondary — TVDB / Wikipedia / Wikidata)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -40 resource-posters-secondary.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify re-sourced posters are live
        if: github.event.inputs.dry_run != 'true'
        run: |
          # tvdb + commons are decay-prone designed sources validate_posters
          # checks by default (Decision 044) — demotes only a 404/410 poster to
          # the archive.org thumbnail; a throttle is left for the next run.
          python tools/validate_posters.py --limit 6000 --workers 16 || true

      - name: Extract what changed

        if: always()

        run: python tools/catalog_delta.py extract --snapshot /tmp/aw-before.json --out aw-deltas.json


      - name: Keep the deltas

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: posters-secondary-deltas

          path: aw-deltas.json

          if-no-files-found: ignore

  # Holds catalog-writers for ~2 minutes instead of the ~166 this workflow
  # averaged. Merging onto a freshly fetched catalog also preserves whatever
  # another writer published while we were re-sourcing.
  apply:
    needs: resource-posters-secondary
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: catalog-writers
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --quiet requests
      - uses: actions/download-artifact@v4
        with:
          name: posters-secondary-deltas
        continue-on-error: true
      - name: Stop if nothing changed
        id: gate
        run: |
          if [ ! -s aw-deltas.json ]; then
            echo "nothing to apply"; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch catalog
        if: steps.gate.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch
      - name: Apply the deltas
        if: steps.gate.outputs.go == 'yes'
        run: python tools/catalog_delta.py apply --deltas aw-deltas.json


      - name: Publish catalog to release
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gh_dispatch.sh publish-db.yml
