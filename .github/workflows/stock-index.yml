name: Stock shot index (#6/#7)

# Creation Studio #6/#7 (Decision 042): detect REAL shot boundaries in clippable films via ffmpeg
# scene detection (tools/build_stock_index.py) and publish clips.sqlite for the macOS stock-shot
# browser. SHARDED across N runners (#7 — the single-runner 60/day was far too thin), each over a
# disjoint popularity-interleaved slice, every 6h. A merge job unions the shard outputs into the
# published index. Resumable: shards skip films already in the existing index.

on:
  schedule:
    - cron: '0 */6 * * *'          # every 6h — 4 shards × per_shard films each run
  workflow_dispatch:
    inputs:
      per_shard:
        description: 'Films per shard this run'
        default: '50'
      max_seconds:
        description: 'Seconds to scan per film'
        default: '300'

concurrency:
  group: stock-index
  cancel-in-progress: false

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch
      - name: Restore existing index (for skip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download stock-index -p clips.sqlite -O existing.sqlite || echo "first run — no existing index"
      - name: Detect shots (shard ${{ matrix.shard }} of 4)
        run: |
          python tools/build_stock_index.py \
            --shard-index ${{ matrix.shard }} --shard-count 4 \
            --limit ${{ github.event.inputs.per_shard || '50' }} \
            --max-seconds ${{ github.event.inputs.max_seconds || '300' }} \
            --seen-from existing.sqlite \
            --out clips-shard-${{ matrix.shard }}.sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: stock-shard-${{ matrix.shard }}
          path: clips-shard-${{ matrix.shard }}.sqlite
          if-no-files-found: ignore

  merge:
    needs: shard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Restore existing index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download stock-index -p clips.sqlite -O clips.sqlite || echo "first run — fresh index"
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: stock-shard-*
      - name: Merge shard indices
        run: |
          python3 - <<'PY'
          import sqlite3, glob
          db = sqlite3.connect("clips.sqlite")
          db.execute("""CREATE TABLE IF NOT EXISTS shots(
              id TEXT PRIMARY KEY, archiveID TEXT, sourceURL TEXT,
              startSeconds REAL, endSeconds REAL, tags TEXT, title TEXT)""")
          n0 = db.execute("SELECT count(*) FROM shots").fetchone()[0]
          # Be EXPLICIT about the 7 shard columns — the published clips.sqlite gains an 8th
          # `tagged` column from tag_stock_shots.py (ALTER TABLE ADD COLUMN), so a bare
          # `SELECT *` (7 values) into the now-8-column target fails ("8 columns but 7 values
          # supplied"). Naming the columns lets `tagged` default for the new shots.
          COLS = "id, archiveID, sourceURL, startSeconds, endSeconds, tags, title"
          for f in sorted(glob.glob("shards/**/clips-shard-*.sqlite", recursive=True)):
              db.execute("ATTACH ? AS s", (f,))
              db.execute(f"INSERT OR IGNORE INTO shots({COLS}) SELECT {COLS} FROM s.shots")
              db.commit(); db.execute("DETACH s")
          n1 = db.execute("SELECT count(*) FROM shots").fetchone()[0]
          films = db.execute("SELECT count(DISTINCT archiveID) FROM shots").fetchone()[0]
          print(f"merged: {n0} -> {n1} shots across {films} films")
          db.close()
          PY
      - name: Publish index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Raw DEFLATE (wbits=-15), matching the catalog convention so the app reuses
          # CatalogRefreshService.inflate (Decision 019) — NOT gzip.
          python3 -c "import zlib; d=open('clips.sqlite','rb').read(); c=zlib.compressobj(9,zlib.DEFLATED,-15); open('clips.sqlite.zz','wb').write(c.compress(d)+c.flush())"
          gh release view stock-index >/dev/null 2>&1 || \
            gh release create stock-index --title "Stock shot index" --notes "clips.sqlite for Creation Studio (#6/#7)"
          gh release upload stock-index clips.sqlite clips.sqlite.zz --clobber
