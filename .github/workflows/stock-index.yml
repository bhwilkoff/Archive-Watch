name: Stock shot index (#6/#7)

# Creation Studio #6/#7 (Decision 042): detect REAL shot boundaries in clippable films via ffmpeg
# scene detection (tools/build_stock_index.py) and publish clips.sqlite for the macOS stock-shot
# browser. SHARDED across N runners (#7 — the single-runner 60/day was far too thin), each over a
# disjoint popularity-interleaved slice, every 6h. A merge job unions the shard outputs into the
# published index. Resumable: shards skip films already in the existing index.

on:
  schedule:
    - cron: '0 */6 * * *'          # every 6h — 8 shards × per_shard films each run
  workflow_dispatch:
    inputs:
      per_shard:
        description: 'Films per shard this run'
        default: '150'
      max_seconds:
        description: 'Seconds to scan per film'
        default: '300'
      concurrency:
        description: 'Films scanned in parallel per shard (×shards = total archive.org streams)'
        default: '2'

concurrency:
  group: stock-index
  cancel-in-progress: false

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch
      - name: Restore existing index (for skip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Only a NON-EXISTENT release is a first run. A release whose asset
        # cannot be fetched must FAIL: an `|| echo "first run"` here is the
        # exact swallow that let subtitle-index rebuild over a missing asset
        # and destroy 702k word timings (Decision 089). Restores from the .zz
        # — the raw clips.sqlite asset is retired (nothing consumes it, and a
        # failed re-upload of a large raw member after --clobber's delete is
        # how the subtitle-index assets vanished).
        run: |
          if gh release view stock-index >/dev/null 2>&1; then
            bash tools/gh_retry.sh gh release download stock-index -p clips.sqlite.zz -O existing.sqlite.zz
            python3 -c "import zlib; open('existing.sqlite','wb').write(zlib.decompress(open('existing.sqlite.zz','rb').read(),-15))"
          else
            echo "first run — no existing index"
          fi
      - name: Detect shots (shard ${{ matrix.shard }} of 8)
        run: |
          python tools/build_stock_index.py \
            --shard-index ${{ matrix.shard }} --shard-count 8 \
            --limit ${{ github.event.inputs.per_shard || '150' }} \
            --max-seconds ${{ github.event.inputs.max_seconds || '300' }} \
            --concurrency ${{ github.event.inputs.concurrency || '2' }} \
            --seen-from existing.sqlite \
            --out clips-shard-${{ matrix.shard }}.sqlite
      # always() so a shard that's OOM-killed mid-run (exit 143) still uploads the films it
      # DID commit (scene_cuts commits per film). Without this the killed shard's partial DB is
      # lost, its films never reach the merge/published index, and --seen-from re-scans the same
      # slice every run — re-hitting the same poison film forever. With it, each run banks
      # progress and the shard advances past a bad film on the next run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-shard-${{ matrix.shard }}
          path: clips-shard-${{ matrix.shard }}.sqlite
          if-no-files-found: ignore

  merge:
    needs: shard
    # Run even if some shards failed (e.g. a transient OOM on one runner). The merge is additive
    # (INSERT OR IGNORE into the existing index) and missing shards' films retry next run via
    # --seen-from, so one stray shard failure must not waste the shards that succeeded.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Restore existing index
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Only a NON-EXISTENT release is a first run (Decision 089). The old
        # `|| echo "first run — fresh index"` swallow meant one failed download
        # would rebuild the index from THIS run's shards alone and republish —
        # destroying every accumulated shard scan, exactly how the word index
        # lost 702k rows. The baseline snapshot guards the publish below
        # against every other cause of shrinkage.
        run: |
          if gh release view stock-index >/dev/null 2>&1; then
            bash tools/gh_retry.sh gh release download stock-index -p clips.sqlite.zz -O clips.sqlite.zz
            python3 -c "import zlib; open('clips.sqlite','wb').write(zlib.decompress(open('clips.sqlite.zz','rb').read(),-15))"
            rm -f clips.sqlite.zz
          else
            echo "first run — fresh index"
          fi
          python3 tools/sqlite_publish_guard.py snapshot clips.sqlite --out .stock_baseline.json
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: stock-shard-*
      - name: Merge shard indices
        run: |
          python3 - <<'PY'
          import sqlite3, glob
          db = sqlite3.connect("clips.sqlite")
          db.execute("""CREATE TABLE IF NOT EXISTS shots(
              id TEXT PRIMARY KEY, archiveID TEXT, sourceURL TEXT,
              startSeconds REAL, endSeconds REAL, tags TEXT, title TEXT)""")
          n0 = db.execute("SELECT count(*) FROM shots").fetchone()[0]
          # Be EXPLICIT about the 7 shard columns — the published clips.sqlite gains an 8th
          # `tagged` column from tag_stock_shots.py (ALTER TABLE ADD COLUMN), so a bare
          # `SELECT *` (7 values) into the now-8-column target fails ("8 columns but 7 values
          # supplied"). Naming the columns lets `tagged` default for the new shots.
          COLS = "id, archiveID, sourceURL, startSeconds, endSeconds, tags, title"
          for f in sorted(glob.glob("shards/**/clips-shard-*.sqlite", recursive=True)):
              db.execute("ATTACH ? AS s", (f,))
              db.execute(f"INSERT OR IGNORE INTO shots({COLS}) SELECT {COLS} FROM s.shots")
              db.commit(); db.execute("DETACH s")
          n1 = db.execute("SELECT count(*) FROM shots").fetchone()[0]
          films = db.execute("SELECT count(DISTINCT archiveID) FROM shots").fetchone()[0]
          print(f"merged: {n0} -> {n1} shots across {films} films")
          db.close()
          PY
      - name: Publish index
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row — but never when the RESTORE failed,
        # or a partial rebuild would publish over the accumulated index.
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/sqlite_publish_guard.py check clips.sqlite --baseline .stock_baseline.json
          # Raw DEFLATE (wbits=-15), matching the catalog convention so the app reuses
          # CatalogRefreshService.inflate (Decision 019) — NOT gzip.
          python3 -c "import zlib; d=open('clips.sqlite','rb').read(); c=zlib.compressobj(9,zlib.DEFLATED,-15); open('clips.sqlite.zz','wb').write(c.compress(d)+c.flush())"
          gh release view stock-index >/dev/null 2>&1 || \
            gh release create stock-index --title "Stock shot index" --notes "clips.sqlite for Creation Studio (#6/#7)"
          # ONLY the .zz. The Creation Studio downloads clips.sqlite.zz; the raw
          # 265 MB member had no consumer, and a failed re-upload of a large raw
          # member after --clobber's delete is how the subtitle-index assets
          # vanished (Decision 089). The delete-asset line retires the stale raw
          # left by pre-094 publishes; once gone it is a no-op.
          bash tools/gh_retry.sh gh release upload stock-index clips.sqlite.zz --clobber
          gh release delete-asset stock-index clips.sqlite -y 2>/dev/null || true
