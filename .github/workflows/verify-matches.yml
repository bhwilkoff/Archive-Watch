name: Verify external matches

# Re-checks every TMDb/OMDb-matched item against the ARCHIVE item's own
# authoritative signals (external-identifier IMDb id, date) + the color flag, and
# re-resolves or clears wrong matches (tools/verify_external_match.py). Bounded
# per run (archive metadata is fetched per item); resumable via `matchVerified`.
# Catalog lives on the release (Decision 018): fetch -> verify -> publish -> DB.

on:
  schedule:
    - cron: '0 5 * * 2'   # weekly, Tue 05:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items to check this run (0 = all)'
        required: false
        default: '8000'
      refresh:
        description: 'Re-check already-verified items (true/false)'
        required: false
        default: 'false'

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Verify external matches
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          python tools/verify_external_match.py \
            --limit ${{ github.event.inputs.limit || '8000' }} \
            ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }} | tee verify.log
          echo "## Verify external matches" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -3 verify.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      - name: Publish catalog to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-db.yml
