name: Verify external matches

# Re-checks every TMDb/OMDb-matched item against the ARCHIVE item's own
# authoritative signals (external-identifier IMDb id, date) + the color flag, and
# re-resolves or clears wrong matches (tools/verify_external_match.py). Bounded
# per run (archive metadata is fetched per item); resumable via `matchVerified`.
# Catalog lives on the release (Decision 018): fetch -> verify -> publish -> DB.

on:
  schedule:
    # Moved into the evening window (2026-07-19): every catalog workflow shares
    # the `catalog-writers` group, and GitHub keeps only ONE pending run per
    # group — a newer arrival supersedes an older PENDING one, so a job that
    # queues behind a busy slot is cancelled before it ever starts. Measured
    # cancellation rates over the last 20 runs: detect-trailers 75%,
    # check-liveness 50%, match-unmatched 33%, free-subtitles 30%,
    # subtitles 25% — while every workflow in a quiet slot sat at 0%.
    # This window is clear of color-classify (00/08/16 UTC) and of the daily
    # check-liveness run (13:00 + up to ~2h). Keep these staggered.
    - cron: '0 19 * * 2'   # weekly, Tue 05:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items to check this run (0 = all)'
        required: false
        default: '8000'
      era_only:
        description: 'Target ONLY the TV items the era tier can judge'
        required: false
        default: 'false'
      refresh:
        description: 'Re-check already-verified items (true/false)'
        required: false
        default: 'false'

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write   # catalog_release.py publish uploads a release asset
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Verify external matches
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: |
          python tools/verify_external_match.py \
            --limit ${{ github.event.inputs.limit || '8000' }} \
            ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }} \
            ${{ github.event.inputs.era_only == 'true' && '--era-only' || '' }} | tee verify.log
          echo "## Verify external matches" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -3 verify.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Judge year twins and episodes matched as films
        # Two judges that ran by hand on 2026-09-16 and nowhere since. The
        # discovery sweep now queues ~1,300 candidates a night (2026-09-24),
        # and every new TMDb match can be an uploader's wrong year or an
        # episode matched to a film. Both judge only on their own evidence
        # and leave anything unresolvable alone; a dry run on 2026-09-24
        # found 0 to change, so a non-zero line here is new drift.
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: |
          python tools/judge_episode_matches.py --apply | tail -1 | sed 's/^/[judge-episodes] /' | tee -a judge.log
          python tools/judge_year_twins.py --apply | tail -1 | sed 's/^/[judge-year-twins] /' | tee -a judge.log
          echo '```' >> $GITHUB_STEP_SUMMARY; cat judge.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      - name: Publish catalog to release
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gh_dispatch.sh publish-db.yml
