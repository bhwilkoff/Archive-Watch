name: Discover + ingest PD content

# Daily pipeline that grows the catalog from multiple public-domain
# sources (see docs/research/omdb-and-pd-discovery.md):
#   1. discover (Wikidata) — PD films by copyright flag / Archive id.
#   2. discover (Archive collections) — mine feature_films / silent_films /
#      classic_tv / prelinger / animation / film_noir; every hit is already
#      a playable Archive item.
#   3. ingest — drain the candidate queue: resolve IA-id-less candidates to
#      a playable item by title+year, validate, classify, enrich via OMDb.
#   4. Library of Congress — ingest US-gov PD films (downloadable MP4),
#      generally not on the Internet Archive.
#   5. episode-wants — resolve each series to its canonical episode list
#      (OMDb) and queue the specific episodes we're missing.
#   6. tv-backfill — prune junk series, then grow under-populated shows via
#      per-want + broad Archive search; mark wants fulfilled.
# All purely additive; commits directly to main.

on:
  schedule:
    # 03:42 UTC — after the OMDb backfill (02:17) so newly-ingested items
    # with IMDb IDs can be rich-enriched the same night, and at an odd
    # minute to dodge the cron-wave.
    - cron: '42 3 * * *'
  workflow_dispatch:
    inputs:
      wants_tmdb_pages:
        description: 'TMDb discover pages for the PD-wants feed (20 titles each)'
        required: false
      discover_limit:
        description: 'Max rows per Wikidata SPARQL feed'
        required: false
        default: '8000'
      max_items:
        description: 'Max candidates to ingest this run'
        required: false
        default: '900'
      prioritize_source:
        description: 'Drain this discoverySource first (e.g. commercials)'
        required: false
        default: ''
      include_low_confidence:
        description: 'Also ingest low rights-confidence candidates'
        required: false
        default: 'false'
      tv_max_series:
        description: 'Max TV series to backfill episodes for this run'
        required: false
        default: '40'
      wants_max_series:
        description: 'Max TV series to resolve canonical episode lists for'
        required: false
        default: '40'
      arch_per_collection:
        description: 'Max items to mine per Internet Archive collection'
        required: false
        default: '600'
      pd_day_years:
        description: 'Publication years to mine as Public Domain Day feed'
        required: false
        default: '1928,1929,1930'
      resolve_limit:
        description: 'Max IA-id-less candidates to resolve by title+year'
        required: false
        default: '600'
      tv_discover_per_collection:
        description: 'Max items to mine per TV collection/subject query'
        required: false
        default: '800'
      repair_limit:
        description: 'Max unplayable derivatives to re-pick to MP4 this run'
        required: false
        default: '500'
      loc_max_items:
        description: 'Max new Library of Congress films to ingest'
        required: false
        default: '30'
      run_loc:
        description: 'Run the LoC feed (only works off a residential IP — loc.gov 403s CI)'
        required: false
        default: 'false'

concurrency:
  # Shared group with omdb-backfill — both push to main, so they must
  # serialize (a concurrent run rejected a push the first time). Also
  # prevents two discover runs racing the candidate queue.
  group: catalog-writers
  cancel-in-progress: false

jobs:
  discover-ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write        # dispatch publish-db after the catalog updates
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # Catalog lives on the catalog-source Release, not git (Decision 018).
      # Pull it local so the discovery/ingest tools mutate it as before.
      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Discover candidates (Wikidata, read-only)
        run: |
          python tools/discover_wikidata_pd.py \
            --limit ${{ github.event.inputs.discover_limit || '8000' }} \
            | tee discover.log

      - name: Discover PD wants (title-first: Wikipedia US-PD list + TMDb pre-cutoff + Wikidata age)
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: |
          # The INVERTED pipeline: enumerate films the metadata world says are
          # PD / lost-copyright (curated renewal-failure list, PD-by-age) and
          # queue them as iaid-less wants — the ingest step below hunts
          # archive.org for each by title+year (archive_lib.resolve_title).
          python tools/discover_pd_wants.py \
            --tmdb-pages ${{ github.event.inputs.wants_tmdb_pages || '40' }} \
            | tee wants.log

      - name: Discover candidates (Archive collections + Public Domain Day)
        run: |
          # Mines feature_films / silent_films / classic_tv / prelinger /
          # animation / film_noir etc. (every hit already playable) PLUS a
          # Public-Domain-Day feed: films published in just-entered PD years
          # (1928–1930), which catches titles outside the curated collections.
          python tools/discover_archive_collections.py \
            --per-collection ${{ github.event.inputs.arch_per_collection || '600' }} \
            --pd-day-years ${{ github.event.inputs.pd_day_years || '1928,1929,1930' }} \
            | tee arch_discover.log

      - name: Discover rights-clear commercials (PD/CC0 only)
        run: |
          # Queues vintage TV/film commercials that carry an explicit Public
          # Domain Mark / CC0 license (Duke AdViews + unlicensed ad uploads are
          # excluded — wrong rights for a public app). Tagged contentTypeHint=
          # commercial so ingest groups them under the Commercials collection;
          # they never appear on Home. See docs/design/channels-tv-guide.md.
          python tools/discover_commercials.py | tee commercials_discover.log

      - name: Discover new TV shows (grow the canonical-TV queue)
        run: |
          # Mines TV collections + TV-subject searches for items we don't yet
          # have and appends them to shared/editorial/tv_discovery.json. The
          # weekly tv-canonical workflow drains this into canonical series.
          python tools/discover_tv_shows.py \
            --per-collection ${{ github.event.inputs.tv_discover_per_collection || '800' }} \
            | tee tvdisc.log

      - name: Ingest a daily batch (parallel; title resolver)
        run: |
          # Resolves PD-flagged candidates lacking an Archive id by title+year,
          # then ingests — parallel (Archive metadata has no hard cap), full
          # catalog only (keeps the bundled seed lean; users get new items via
          # the Pages refresh), and OMDb-free (items land as archiveOnly and
          # enrich_movies (TMDb, uncapped) fills metadata in the OMDb workflow).
          # This lets the cap be high enough to actually drain the queue.
          python tools/ingest_candidates.py \
            --max-items ${{ github.event.inputs.max_items || '900' }} \
            --resolve-limit ${{ github.event.inputs.resolve_limit || '600' }} \
            ${{ github.event.inputs.prioritize_source && format('--prioritize-source {0}', github.event.inputs.prioritize_source) || '' }} \
            --workers 6 --no-seed --skip-omdb \
            ${{ github.event.inputs.include_low_confidence == 'true' && '--include-low-confidence' || '' }} \
            | tee ingest.log

      - name: Discover + ingest Library of Congress films
        # loc.gov blocks datacenter IPs (incl. GitHub runners) with a 403,
        # so this only does real work on a residential IP / self-hosted
        # runner. Manual-dispatch-only to avoid a daily no-op; the script
        # also skips cleanly on 403 if it ever does run here.
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_loc == 'true'
        run: |
          python tools/discover_loc.py \
            --max-items ${{ github.event.inputs.loc_max_items || '30' }} \
            | tee loc.log || true

      - name: Build episode-wants queue (canonical lists from OMDb)
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          # Resolve each series to its IMDb ID, pull the canonical episode
          # list, and queue the episodes we're missing. Series are cached
          # after first resolve, so this drains the unresolved ones daily.
          python tools/build_episode_wants.py \
            --max-series ${{ github.event.inputs.wants_max_series || '40' }} \
            | tee wants.log

      - name: Backfill TV episodes (prune junk + grow under-populated series)
        run: |
          # Prunes junk series, prioritises series with known gaps (from the
          # wants queue), grows under-populated series, and marks fulfilled
          # wants. Targets <=8-episode series first for the biggest wins.
          python tools/backfill_tv_episodes.py \
            --prune \
            --min-episodes 8 \
            --max-series ${{ github.event.inputs.tv_max_series || '40' }} \
            | tee tv.log

      - name: Audit series episodes (wrong-show / parody / review content)
        run: |
          # Catches what the backfill guards miss: episodes whose title or
          # contestant name collides with another show's name ("Murphy Brown
          # S08E12 All in the Family", Pingu in The Snowman), GoAnimate
          # "grounded" parodies, review vlogs, scrape mirrors. Network-
          # confirmed against the Archive item's own metadata + TVmaze
          # before anything is removed; every action lands in the CSV.
          python tools/audit_series_episodes.py --confirm --apply \
            | tee episode_audit.log

      - name: Upload episode-audit manifest
        uses: actions/upload-artifact@v4
        with:
          name: episode-audit
          path: tools/audit_series_episodes.csv
          if-no-files-found: ignore

      - name: Repair unplayable derivatives (.ogv -> MP4 guard)
        run: |
          # Idempotent: skips items already on a playable MP4, so this is cheap
          # most days and only does work for freshly-ingested Ogg/MKV items.
          # Capped so a bad day can't balloon into thousands of Archive calls;
          # it catches up over subsequent runs.
          python tools/repair_derivatives.py \
            --limit ${{ github.event.inputs.repair_limit || '500' }} \
            | tee repair.log

      - name: Stamp public-domain rights evidence
        run: |
          # Records WHY each title is PD (pre-1930 = by age; source-flagged;
          # or source-unverified for the 1929-63 non-renewal window). Sound
          # + conservative — see tools/rights_evidence.py.
          python tools/rights_evidence.py | tee rights.log

      - name: Summary
        run: |
          echo "## Daily content pipeline" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '--- wikidata discover ---'   >> $GITHUB_STEP_SUMMARY; tail -4 discover.log >> $GITHUB_STEP_SUMMARY
          echo '--- archive collections ---' >> $GITHUB_STEP_SUMMARY; tail -4 arch_discover.log >> $GITHUB_STEP_SUMMARY
          echo '--- tv discovery ---'         >> $GITHUB_STEP_SUMMARY; tail -6 tvdisc.log >> $GITHUB_STEP_SUMMARY
          echo '--- derivative repair ---'     >> $GITHUB_STEP_SUMMARY; tail -3 repair.log >> $GITHUB_STEP_SUMMARY
          echo '--- ingest (+resolver) ---'  >> $GITHUB_STEP_SUMMARY; tail -8 ingest.log >> $GITHUB_STEP_SUMMARY
          [ -f loc.log ] && { echo '--- library of congress ---' >> $GITHUB_STEP_SUMMARY; tail -3 loc.log >> $GITHUB_STEP_SUMMARY; }
          echo '--- episode wants ---'        >> $GITHUB_STEP_SUMMARY; tail -3 wants.log >> $GITHUB_STEP_SUMMARY
          echo '--- tv backfill ---'          >> $GITHUB_STEP_SUMMARY; tail -8 tv.log >> $GITHUB_STEP_SUMMARY
          echo '--- episode audit ---'        >> $GITHUB_STEP_SUMMARY; tail -4 episode_audit.log >> $GITHUB_STEP_SUMMARY
          echo '--- rights evidence ---'       >> $GITHUB_STEP_SUMMARY; tail -3 rights.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # catalog.json + the seed catalog.json are no longer in git
          # (Decision 018) — they go to the catalog-source release below.
          git add shared/editorial/discovery_candidates.json \
                  shared/editorial/omdb_cache.json \
                  shared/editorial/episode_wants.json \
                  shared/editorial/tv_discovery.json \
                  series/

          if git diff --cached --quiet; then
            echo "No git-tracked changes (catalog still published to release below)."
            exit 0
          fi

          git commit -m "Discover + ingest + TV backfill (${{ github.run_id }})"

          # Push with rebase-retry (see omdb-backfill.yml for rationale).
          # The shared catalog-writers concurrency group serializes us with
          # the OMDb job; a rejected push means main merely advanced, so a
          # plain rebase replays our commit. Fail loudly on a real conflict.
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed (attempt $attempt)"; exit 0; fi
            echo "push rejected; rebasing onto latest main (attempt $attempt)…"
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not push after retries"; exit 1

      # Publish the mutated catalog to the catalog-source release (Decision
      # 018). Always runs — catalog changes aren't git-tracked. publish-db
      # rebuilds the SQLite from it on its schedule.
      # Self-healing data-quality pass (year leaks, silent/animation
      # misclass, adult flags) before the catalog goes to the release.
      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      - name: Publish catalog to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-db.yml
