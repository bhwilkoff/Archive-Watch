name: Verify playback (strict / AVFoundation)

# STRICT playability verification against AVFoundation — the app's REAL playback
# engine — instead of check_liveness.py's lenient 1 KB byte-probe (which every
# ffprobe/curl/requests-style check shares: they auto-encode URLs and never decode
# a frame, so a URL passes the byte-probe yet fails in the app with "resource
# unavailable"). Each shard runs the compiled Swift harness
# (tools/PlaybackVerifierCLI) on a macOS runner, loading each URL exactly as
# DetailView does (MP4 via AVURLAsset + the app's encoding; a captioned item's
# subtitleHLS via AVPlayerItem on the raw master URL), waiting for readyToPlay and
# decoding a real frame. HARD verdicts set a reversible excluded=true; TRANSIENT
# ones are left unverified (retried next run) — a wrongly-hidden playable film is
# the costly error, so we bias against it.
#
# Sharded macOS matrix -> per-shard delta artifacts -> ONE publish job merges +
# applies them (mirrors the subtitle/liveness fetch->shard->merge->single-publish
# pattern so parallel shards never clobber the shared catalog on the release).
#
# ONGOING AUDIT (Decision 044-style enforce-every-build discipline): this runs
# daily. The bounded default (1500/shard x 4 = 6000 items/day) drains the ~40k
# catalog in ~7 days, then just maintains + catches newly-ingested titles (the
# strict pass UPGRADES the Linux ingest-time lenient probe). An apply-time infra
# circuit breaker (UNAVAIL_CIRCUIT_BREAKER_FRAC in verify_playback_strict.py)
# ignores a run where archive.org throttled our IP, so a bad-network day never
# mass-hides playable films.
#
# UTC-slot map (dodge the catalog-writer cron-wave):
#   00,08 color-classify | 01:10 rights-audit | 02:15 validate-posters
#   03:42 discover-content | 04:30 publish-db | 05:00 cover-gen + rebuild(Mon)
#   06:00 free-subtitles | 13:00 check-liveness
#   weeklies: 18:00 Wed detect-trailers | 19:00 Tue verify-matches
#             20:00 Thu subtitles | 21:00 Mon match-unmatched
# 10:20 UTC is clear (nothing else in the 09:00-12:00 window) and an odd minute
# to avoid top-of-hour runner congestion. The macOS verify shards only READ the
# catalog, so they do NOT sit in the catalog-writers group (see the publish job).

on:
  schedule:
    - cron: '20 10 * * *'   # daily 10:20 UTC — quiet slot (see the map above)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items to verify PER SHARD this run (0 = all in shard)'
        required: false
        default: '1500'
      shard_count:
        description: 'Number of parallel macOS shards'
        required: false
        default: '4'
      max_minutes:
        description: 'Stop starting new batches after N minutes per shard (0 = no budget)'
        required: false
        default: '180'

# NO whole-workflow concurrency: the macOS verify shards are READ-ONLY (they fetch
# the catalog + upload delta artifacts, mutating nothing), so they must NOT sit in
# the catalog-writers group — a newer pending catalog-writer would supersede a long
# multi-hour verify and starve it (the group keeps only one pending run). Only the
# short ubuntu publish job mutates the catalog, and it alone holds the writers lock.

jobs:
  # Fan-out: each shard fetches the catalog, verifies its slice of the items, and
  # uploads ONLY a compact per-item verdict delta (not the whole catalog).
  verify:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: macos-15
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests

      # ffprobe disambiguates an AVFoundation container/parse error (apple_container_
      # error) into faststart-quirk (keep) vs truncated (exclude) vs exotic-codec —
      # so a valid H.264 moov-at-EOF film is never blind-excluded. Preinstalled on
      # macos-15 runners; install only if missing.
      - name: Ensure ffmpeg/ffprobe
        run: command -v ffprobe >/dev/null 2>&1 || brew install ffmpeg

      - name: Build the strict verifier
        run: swift build -c release
        working-directory: tools/PlaybackVerifierCLI

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Verify shard ${{ matrix.shard }}
        run: |
          # Guard: only run this shard if it's within the requested shard_count
          # (the matrix is fixed at 4; a smaller shard_count no-ops the extras).
          COUNT=${{ github.event.inputs.shard_count || '4' }}
          if [ "${{ matrix.shard }}" -ge "$COUNT" ]; then
            echo "shard ${{ matrix.shard }} >= shard_count $COUNT — nothing to do"
            echo '{}' > delta-${{ matrix.shard }}.json
            exit 0
          fi
          python tools/verify_playback_strict.py \
            --shard-index ${{ matrix.shard }} --shard-count "$COUNT" \
            --limit ${{ github.event.inputs.limit || '1500' }} \
            --max-minutes ${{ github.event.inputs.max_minutes || '180' }} \
            --concurrency 4 --no-publish \
            --deltas-out delta-${{ matrix.shard }}.json | tee shard-${{ matrix.shard }}.log
          echo "## Strict verify shard ${{ matrix.shard }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -3 shard-${{ matrix.shard }}.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload shard delta
        uses: actions/upload-artifact@v4
        with:
          name: strict-delta-${{ matrix.shard }}
          path: delta-${{ matrix.shard }}.json
          if-no-files-found: warn

  # Fan-in: a single job merges every shard delta onto the fetched catalog and
  # publishes — one writer, no clobber. Runs even if a shard failed, applying the
  # deltas that DID land.
  publish:
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only the publish job mutates the shared catalog on the release, so ONLY it
    # joins the catalog-writers group. It's short (merge deltas + publish), so it
    # holds the lock briefly and can't starve other writers.
    concurrency:
      group: catalog-writers
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests

      # apply-deltas re-runs the ffprobe disambiguation for every apple_container_
      # error / codec delta at apply time, so the publish job needs ffprobe too.
      - name: Ensure ffmpeg/ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      - name: Download all shard deltas
        uses: actions/download-artifact@v4
        with:
          pattern: strict-delta-*
          path: deltas
          merge-multiple: true

      - name: Apply deltas + publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/verify_playback_strict.py --apply-deltas deltas --publish | tee apply.log
          echo "## Strict verify — apply + publish" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -3 apply.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gh_dispatch.sh publish-db.yml
