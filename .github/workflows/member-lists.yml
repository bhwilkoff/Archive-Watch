name: Member lists

# Collections made by archive.org members, in their own words
# (tools/harvest_member_lists.py, ORPHANED-FILMS #1). Weekly: members make
# lists slowly, and each run asks ~2,300 of them. Rewrites only the `list-*`
# entries of shared/editorial/collection_metadata.json; publish-db and
# deploy-pages carry them from there. A member who cannot be reached keeps
# last week's lists; a run where most cannot is red (Decision 107).

on:
  schedule:
    - cron: '43 9 * * 0'
  workflow_dispatch:

concurrency:
  group: member-lists
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch
      - name: Harvest
        run: |
          set -o pipefail
          python tools/harvest_member_lists.py | tee harvest.log
          python tools/test_member_lists.py
          { echo '## Member lists'; echo '```'; cat harvest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- shared/editorial/collection_metadata.json; then
            echo "No change."; exit 0
          fi
          git add shared/editorial/collection_metadata.json
          git commit -m "Member lists: weekly harvest from archive.org"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 10))
          done
          echo "::error::could not push after 5 attempts"; exit 1
