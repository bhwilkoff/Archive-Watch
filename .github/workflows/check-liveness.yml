name: Check Archive liveness

# Probes archive.org/metadata for catalog items and marks genuinely-dead items
# (dark / removed / no playable derivative) excluded=true (reversible), and
# refreshes stale download URLs for live items whose baked filename was
# re-derived (tools/check_liveness.py). A dead item that won IMDb dedup used to
# HIDE its live siblings (the Niagara Falls 1941 case) — excluding it lets a live
# copy surface. Transient timeouts/5xx are left UNCONFIRMED, never wrongly hidden.
# IMDb-cluster members are checked first. Catalog lives on the release
# (Decision 018): fetch -> check -> publish -> DB.

on:
  schedule:
    # DAILY, not weekly: the byte-level playability probe has a ~22k-item
    # backlog to work through (most of the catalog was only ever checked
    # metadata-only), and the 90-day re-probe TTL then needs steady throughput
    # to keep coverage from decaying.
    #
    # 13:00 UTC. Slot choice is load-bearing, not cosmetic. Every catalog
    # workflow shares the `catalog-writers` concurrency group, and GitHub keeps
    # only ONE pending run per group — a newer arrival SUPERSEDES an older
    # pending one. This job is long (up to the --max-minutes budget), so if it
    # queues behind the morning wave it gets cancelled before it ever starts a
    # job. Measured 2026-07-19: 2 of the last 4 scheduled runs were cancelled
    # while pending, and a 09:43Z dispatch was cancelled having never started —
    # which is why playability coverage stalled for months while the tool itself
    # was healthy.
    #
    # Scheduled writers, UTC: color-classify 00/08/16 (every 8h) · rights-audit
    # 01:10 · validate-posters 02:15 · cover-generation 05:00 · free-subtitles
    # 06:00 · plus publish-db, which each of them dispatches on completion.
    # 13:00 is clear of all of them and leaves ~3h of headroom before the 16:00
    # color-classify. Keep it there; moving it back into the morning re-creates
    # the starvation.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items to probe this run (0 = all)'
        required: false
        default: '8000'
      clusters_only:
        description: 'Only probe multi-copy IMDb clusters (true/false)'
        required: false
        default: 'false'
      refresh:
        description: 'Re-check already-checked items (true/false)'
        required: false
        default: 'false'
      no_probe:
        description: 'Metadata only; skip the byte playability probe (true/false)'
        required: false
        default: 'false'
      reprobe_days:
        description: 'Re-verify playback older than N days (0 = never)'
        required: false
        default: '90'
      max_minutes:
        description: 'Stop starting new probes after N minutes (0 = no budget)'
        required: false
        default: '120'
      ids:
        description: 'TARGETED: probe exactly these archiveIDs (space/comma separated), ignoring the popularity sort and budget'
        required: false
        default: ''

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py fetch

      # TARGETED mode exists because the ordinary sweep is popularity-ordered and
      # budget-bounded: on 2026-08-09 it probed 7,153 of 18,681 hot items, and the
      # two titles the owner actually reported sat in the 11,528 it never reached.
      # A specific reported title must be fixable now, not in three days' drain.
      - name: Check liveness
        # Backstop for when the budget cannot stop it — one hung request
        # inside a single item is how a 180-minute budget ran 360.
        # Fails the STEP, so the publish steps below still run.
        timeout-minutes: 150
        run: |
          IDS="${{ github.event.inputs.ids }}"
          if [ -n "$IDS" ]; then
            printf '%s\n' $(echo "$IDS" | tr ',' ' ') > /tmp/aw-ids.txt
            echo "targeted: $(wc -l < /tmp/aw-ids.txt | tr -d ' ') archiveIDs"
            python tools/check_liveness.py --ids /tmp/aw-ids.txt | tee liveness.log
            echo "## Archive liveness (targeted)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY; tail -5 liveness.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          python tools/check_liveness.py \
            --limit ${{ github.event.inputs.limit || '8000' }} \
            --reprobe-days ${{ github.event.inputs.reprobe_days || '90' }} \
            --max-minutes ${{ github.event.inputs.max_minutes || '120' }} \
            ${{ github.event.inputs.clusters_only == 'true' && '--clusters-only' || '' }} \
            ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }} \
            ${{ github.event.inputs.no_probe == 'true' && '--no-probe' || '' }} | tee liveness.log
          echo "## Archive liveness" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; tail -3 liveness.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Remediate catalog data quality
        run: python tools/remediate_catalog.py

      - name: Publish catalog to release
        # Publish what finished. A killed compute step above must not
        # discard the run's work, which is how faststart-derivatives lost
        # two monthly passes in a row.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/catalog_release.py publish

      - name: Rebuild app DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gh_dispatch.sh publish-db.yml
