# Version catalog — single source of truth for every dependency version.
# Simplified single-module v1 spine: no Hilt, no Room (BundledSQLiteDriver
# queries the published catalog.sqlite directly per docs/CATALOG-CONTRACT.md),
# no Ktor (OkHttp + kotlinx-serialization is enough for two JSON files).

[versions]
agp = "9.2.1"                  # AGP 9.x bundles Kotlin support; no separate kotlin.android plugin
kotlin = "2.1.21"
compose-bom = "2026.05.00"
compose-material3 = "1.5.0-alpha19"
material3-adaptive = "1.1.0"
# Compose for TV. NOTE: depend on tv-material ONLY. `tv-foundation` and every
# TvLazy* composable were REMOVED once their behavior merged into
# compose-foundation — TV lists/grids use the standard LazyRow/LazyColumn
# (docs/TV-DESIGN.md §6.1, Decision 047).
tv-material = "1.1.0"
activity-compose = "1.10.1"
lifecycle = "2.9.1"
coroutines = "1.9.0"
serialization = "1.7.3"
datastore = "1.1.1"
coil = "3.4.0"
okhttp = "4.12.0"
splashscreen = "1.0.1"
media3 = "1.9.4"
sqlite = "2.6.2"               # androidx.sqlite — BundledSQLiteDriver guarantees FTS5
junit = "4.13.2"
junit-ext = "1.2.1"
espresso = "3.6.1"

[libraries]
# --- Compose BOM (pins ui / foundation / material together)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# --- Compose for TV (10-foot D-pad surfaces; docs/TV-DESIGN.md §6)
tv-material = { module = "androidx.tv:tv-material", version.ref = "tv-material" }

# --- Adaptive navigation (bottom bar → rail → drawer by window size)
material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3-adaptive" }
material3-adaptive-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }

# --- Activity + Lifecycle
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

# --- Coroutines + Serialization
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# --- Persistence: DataStore (settings) + androidx.sqlite (catalog + user state)
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# --- Image loading (Coil 3 over the shared OkHttpClient)
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# --- Networking
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# --- Media3 / ExoPlayer (playback + Archive idle-reset resilience, plan §3)
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
# Clip Studio export engine (CREATE-STUDIO-PLAN §5): Transformer trims +
# reframes + overlays a caption/credit and encodes MP4; effect carries the
# Presentation (reframe) + OverlayEffect (TextOverlay).
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }

# --- Splash
splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

# --- Testing
junit = { module = "junit:junit", version.ref = "junit" }
junit-ext = { module = "androidx.test.ext:junit", version.ref = "junit-ext" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[bundles]
compose-core = [
    "compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview",
    "compose-foundation", "compose-material3", "compose-material-icons-extended",
]
adaptive = ["material3-adaptive", "material3-adaptive-suite"]
media3 = [
    "media3-exoplayer", "media3-ui", "media3-datasource-okhttp", "media3-session",
    "media3-transformer", "media3-effect",
]
