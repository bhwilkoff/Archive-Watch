org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Compose
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# The KOTLIN compile daemon is a SEPARATE JVM from Gradle's and takes its own
# heap — unbounded by default. A release build (R8 + Kotlin) on top of an
# already-busy Mac drove this machine to 18% free and 7M pageouts, which is
# what swapping feels like from the keyboard. Bound it.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# parallel=true with no cap spawns one worker per core; on this machine that
# is the difference between a build and a stall.
org.gradle.workers.max=4
